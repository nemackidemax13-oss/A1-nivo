<style>
:root{--red:#e10600;--red2:#b50000;--gold:#d4a017;--ink:#161616;--muted:#64748b;--line:#e5e7eb;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(145deg,#f6f7f9,#fff 58%,#fff6dc);color:#172033;min-height:100vh}
.topbar{height:7px;background:linear-gradient(90deg,var(--red),#ff362d,var(--gold))}
header{background:#111827;color:#fff;padding:24px 18px 34px;box-shadow:0 12px 30px rgba(0,0,0,.13)}.wrap{max-width:980px;margin:auto}.brand{display:flex;align-items:center;gap:16px}.brand img{width:118px;height:66px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.brand h1{margin:0;font-size:clamp(24px,4vw,40px);line-height:1.08}.brand p{margin:7px 0 0;color:#d1d5db;font-size:15px}
main{max-width:980px;margin:-18px auto 50px;padding:0 14px}.panel{background:#fff;border:1px solid #ececec;border-radius:24px;box-shadow:0 16px 44px rgba(15,23,42,.12);padding:20px}.lesson-title{font-weight:900;font-size:clamp(19px,3vw,28px);margin:2px 0 5px}.lesson-sub{color:var(--muted);margin:0}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 4px}.pill{background:#f1f5f9;border-radius:999px;padding:7px 10px;font-size:13px;color:#334155;font-weight:800}.pill.red{background:#fff0ef;color:#a50000;border:1px solid #ffd1ce}
#quiz{margin-top:14px}.q{border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0;background:#fff;box-shadow:0 3px 12px rgba(15,23,42,.03)}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.qnum{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em}.qtype{font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#475569;font-weight:700}.prompt{font-size:18px;font-weight:900;margin:10px 0 14px;line-height:1.35}.answers{display:grid;gap:9px}.choice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;background:#fff;transition:.15s}.choice:hover{background:#f8fafc;border-color:#cbd5e1}.choice input{transform:scale(1.15)}
.wordbank,.sentencebox{display:flex;flex-wrap:wrap;gap:8px}.word{border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:9px 11px;cursor:pointer;font-weight:800}.word.used{opacity:.35;pointer-events:none}.sentencebox{min-height:50px;border:1.5px dashed #94a3b8;border-radius:12px;padding:8px;margin-bottom:10px;background:#fbfdff}.sentencebox .word{background:#111827;color:#fff;border-color:#111827}.smallbtn{padding:8px 11px;border:0;border-radius:9px;background:#e2e8f0;cursor:pointer;font-weight:800}
.feedback{margin-top:11px;font-weight:900}.correct{color:var(--ok)}.wrong{color:var(--bad)}.actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #eee;margin:18px -20px -20px;padding:15px 20px;display:flex;gap:10px;flex-wrap:wrap;border-radius:0 0 24px 24px}.btn{border:0;border-radius:14px;padding:13px 17px;font:inherit;font-weight:900;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 8px 18px rgba(225,6,0,.2)}.btn-secondary{background:#eef2f7;color:#111827}.result{margin:18px 0 4px;padding:20px;border-radius:18px;background:#111827;color:#fff;display:none}.score{font-size:38px;font-weight:1000}.result p{margin:5px 0 0;color:#d1d5db}.foot{color:#64748b;text-align:center;font-size:13px;margin:24px 0 2px}
@media(max-width:640px){header{padding:18px 14px 30px}.brand{align-items:flex-start}.brand img{width:92px;height:54px}.panel{padding:14px}.q{padding:14px}.prompt{font-size:17px}.actions{margin-left:-14px;margin-right:-14px;margin-bottom:-14px;padding:12px 14px}.btn{flex:1}.qtype{font-size:11px}}
</style>
