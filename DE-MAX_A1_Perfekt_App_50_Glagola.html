<style>
:root{
  --blue:#083f96; --blue2:#0b6ed0; --navy:#05295f; --gold:#ffd233;

  --green:#19884b; --red:#cf3036;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;background:
radial-gradient(circle at 10% 2%,rgba(255,255,255,.98),transparent 28%),
linear-gradient(180deg,#dcefff 0,#fbfdff 42%,#edf7ff 100%)}
.app{max-width:980px;margin:auto;padding:10px 10px 94px}
.hero{

  box-shadow:0 16px 34px rgba(2,65,128,.24);position:relative;overflow:hidden

.hero:after{content:"";position:absolute;right:-90px;top:-120px;width:250px;height:250px;border:34px solid rgba(255,255,255,.07);border-radius:50%}

.logo small{font-size:10px;color:#111}
.level{border:2px solid #dceeff;border-radius:13px;padding:6px 12px;font-weight:1000}
h1{font-size:clamp(30px,7vw,52px);line-height:1;margin:14px 0 2px}
.sub1{font-size:clamp(22px,4vw,30px);font-weight:1000;color:#d9ebff;margin:0}
.sub2{margin:6px 0 0;color:#dceeff;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 10px;font-weight:900;font-size:13px}
.progressbox{height:11px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-top:12px}
.progress{height:100%;width:0;background:#fff;transition:.25s}

.tabs{
 display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
 margin:13px 0;position:sticky;top:4px;z-index:15;padding:6px;border-radius:18px;
 background:rgba(234,245,255,.92);backdrop-filter:blur(10px)

.tab{
 border:1px solid var(--line);background:#fff;color:#0b467e;border-radius:14px;
 padding:10px 7px;min-height:58px;font-size:12px;font-weight:1000;cursor:pointer

.tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}

.card{
 background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;
 box-shadow:0 13px 30px rgba(36,89,140,.12)
}
.counter{text-align:right;color:#617a90;font-size:13px;font-weight:900}
.kicker{font-size:12px;color:var(--blue2);font-weight:1000;text-transform:uppercase;letter-spacing:.8px}
.title{font-size:clamp(23px,5vw,33px);font-weight:1000;line-height:1.12;margin:5px 0}
.help{margin:0 0 12px;color:var(--muted);font-weight:700}
.question{
 background:linear-gradient(180deg,#f9fcff,#eff7ff);border:2px solid #d8e9f8;
 border-radius:18px;padding:15px;margin:12px 0
}
.qmain{font-size:clamp(22px,5.5vw,30px);font-weight:1000;line-height:1.23}
.tr{font-style:italic;color:#627991;font-weight:750;margin-top:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#e6f2ff;color:#0754a3;border:1px solid #afd2f2;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:900}

.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.option{
 border:2px solid #cfe2f5;background:#fff;color:#0b477f;border-radius:14px;
 padding:13px 9px;font-size:18px;font-weight:1000;cursor:pointer;transition:.15s
}
.option:hover{transform:translateY(-1px)}
.option.correct{background:#e9f8ef;border-color:#68bd82;color:#166a39}
.option.wrong{background:#fff0f0;border-color:#ef9898;color:#9b2d2d}

.build-zone{
 min-height:72px;border:2px dashed #9bc7ee;background:#f3f9ff;border-radius:16px;
 padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin:12px 0
}
.words{display:flex;flex-wrap:wrap;gap:7px}
.word,.placed{border-radius:12px;padding:9px 11px;font-weight:1000;cursor:pointer}
.word{background:#fff;color:#0c4e90;border:1px solid #b8d7f3;box-shadow:0 3px 7px rgba(24,75,122,.08)}
.word.used{opacity:.32;pointer-events:none}
.placed{background:#0863ba;color:#fff}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:1000;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.ghost{background:#edf6ff;color:#0753a1;border:1px solid #c6dff7}
.small{padding:9px 12px;font-size:14px}

.feedback{display:none;margin-top:13px;padding:12px 13px;border-radius:15px;font-weight:850;line-height:1.45}
.feedback.show{display:block}
.feedback.ok{background:#e9f8ef;color:#176b3b;border:1px solid #92d5a8}
.feedback.no{background:#fff0f0;color:#982929;border:1px solid #efadad}
.soundnote{margin-top:8px;color:#55738e;font-size:13px;font-weight:800}
.rule{margin-top:15px;background:#073a79;color:#fff;border-radius:18px;padding:13px 14px;font-weight:800;line-height:1.45}
.rule b{color:#ffd759}
.footer{
 position:fixed;bottom:9px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 18px));
 display:flex;gap:8px;padding:8px;border-radius:18px;background:rgba(255,255,255,.96);
 border:1px solid #d4e5f4;box-shadow:0 10px 30px rgba(0,61,119,.2);z-index:20;backdrop-filter:blur(12px)

.footer button{flex:1}
@media(max-width:700px){

<section class="hero">

    <div class="logo">DE-MAX <small>TUTIN</small></div>
    <div class="level">A1</div>
  </div>
  <h1>PERFEKT</h1>
  <p class="sub1">perfekat</p>

  <div class="stats">

  </div>
  <div class="progressbox"><div class="progress" id="progress"></div></div>
</section>

<nav class="tabs">
  <button class="tab active" data-mode="partizip">1. Infinitiv – Partizip II</button>
  <button class="tab" data-mode="affirm">2. Potvrdne</button>
  <button class="tab" data-mode="question">3. Upitne</button>
  <button class="tab" data-mode="aux">4. Haben / Sein</button>
</nav>

<main class="card">
  <div class="counter" id="counter"></div>
  <div id="content"></div>
</main>

<section class="rule">
  <b>Perfekt:</b> pomoćni glagol <b>haben</b> ili <b>sein</b> stoji na drugom mestu u potvrdnoj rečenici,
  a glavni glagol ide u <b>Partizip II</b> na kraju rečenice.
</section>
</div>

<div class="footer">
  <button class="btn ghost" id="prev">← Prethodno</button>
  <button class="btn primary" id="next">Sledeće →</button>
</div>

let mode="partizip", index=0, attempts=0, correct=0, placed=[];
const done=new Set();
const content=document.getElementById("content"), counter=document.getElementById("counter");

function speak(text){
  if(!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="de-DE"; u.rate=.86;
  const v = speechSynthesis.getVoices().find(x=>/^de/i.test(x.lang));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function norm(arr){return arr.join(" ").replace(/\s+([?.!,])/g,"$1")}
function activeArray(){
  return mode==="partizip" ? VERBS : mode==="affirm" ? AFFIRM : mode==="question" ? QUESTION : AUX;
}
function updateStats(){
  document.getElementById("correct").textContent=correct;
  document.getElementById("attempts").textContent=attempts;
  document.getElementById("accuracy").textContent=(attempts?Math.round(correct/attempts*100):0)+"%";
  const total = VERBS.length + AFFIRM.length + QUESTION.length + AUX.length;
  document.getElementById("progress").style.width=(done.size/total*100)+"%";
}
function markCorrect(){
  const key = mode+":"+index;
  if(!done.has(key)){done.add(key);correct++}
  updateStats();
}
function render(){
  speechSynthesis.cancel();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.mode===mode));
  const arr = activeArray(); if(index>=arr.length) index=0;
  counter.textContent=(index+1)+" / "+arr.length;
  if(mode==="partizip") renderPartizip(arr[index]);
  else if(mode==="affirm" || mode==="question") renderBuilder(arr[index]);
  else renderAux(arr[index]);
}
function renderPartizip(item){
  const pool = VERBS.filter(v=>v.part!==item.part).map(v=>v.part);
  const distractors = [];
  while(distractors.length<3){
    const pick = pool[Math.floor(Math.random()*pool.length)];
    if(!distractors.includes(pick)) distractors.push(pick);
  }
  const opts = [item.part, ...distractors].sort(()=>Math.random()-.5);
  content.innerHTML=`
    <div class="kicker">A1 • Perfekt</div>
    <div class="title">Vežbanje Infinitiv – Partizip II</div>
    <p class="help">Izaberi odgovarajući <b>Partizip II</b> za dati infinitiv. Prikazuje se i pomoćni glagol da lakše pamtiš perfekt.</p>
    <div class="chips">
      <span class="chip">Infinitiv: ${item.inf}</span>
      <span class="chip">Značenje: ${item.sr}</span>
      <span class="chip">Pomoćni glagol: ${item.aux}</span>
    </div>
    <div class="question">
      <div class="qmain">${item.inf} → ?</div>
      <div class="tr">${item.sr}</div>
    </div>
    <div class="options">
      ${opts.map(x=>`<button class="option" data-v="${x}">${x}</button>`).join("")}
    </div>
    <div id="feedback" class="feedback"></div>`;
  const btns=[...document.querySelectorAll(".option")];
  btns.forEach(b=>b.onclick=()=>{
    if(b.disabled) return;
    attempts++; updateStats();
    const e=document.getElementById("feedback");
    if(b.dataset.v===item.part){
      btns.forEach(x=>x.disabled=true); b.classList.add("correct");
      markCorrect();
      e.className="feedback show ok";
      e.innerHTML=`✓ Tačno!<br><b>${item.inf} → ${item.part}</b><br>Pomoćni glagol: <b>${item.aux}</b><br>${item.sr}`;
      speak(item.part);
    }else{
      b.classList.add("wrong"); b.disabled=true;
      e.className="feedback show no";
      e.innerHTML=`✗ Nije tačno. Pokušaj ponovo.`;
    }
  });
}
function renderBuilder(item){
  placed=[];
  const isAff = mode==="affirm";
  const shuffled = item.w.map((w,i)=>({w,i})).sort(()=>Math.random()-.5);
  content.innerHTML=`
    <div class="kicker">A1 • Perfekt</div>
    <div class="title">${isAff ? "Složi potvrdnu rečenicu" : "Složi upitnu rečenicu"}</div>
    <p class="help">${isAff
      ? "Složi potvrdnu rečenicu u perfektu. Posle provere videćeš rešenje, prevod i čućeš rečenicu."
      : "Složi upitnu rečenicu u perfektu. Posle provere videćeš rešenje, prevod i čućeš rečenicu."}</p>
    <div class="question">
      <div class="qmain">Složi rečenicu od ponuđenih reči</div>
      <div class="tr">${item.tr}</div>
    </div>
    <div class="build-zone" id="zone"><span style="color:#7890a8;font-weight:900">Pritisni reči pravilnim redosledom…</span></div>
    <div class="words">${shuffled.map(x=>`<button class="word" data-o="${x.i}" data-w="${x.w}">${x.w}</button>`).join("")}</div>
    <div class="actions">
      <button class="btn primary" id="check">Proveri</button>
      <button class="btn ghost" id="reset">Obriši</button>
      <button class="btn ghost small" id="showSolution">Prikaži rešenje</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <div class="soundnote">🔊 Kada učenik proveri rečenicu, aplikacija prikazuje tačno rešenje, prevod i čita nemačku rečenicu.</div>`;
  const zone=document.getElementById("zone");
  const btns=[...document.querySelectorAll(".word")];
  function redraw(){
    zone.innerHTML=placed.length
      ? placed.map((p,j)=>`<span class="placed" data-j="${j}">${p.w}</span>`).join("")
      : `<span style="color:#7890a8;font-weight:900">Pritisni reči pravilnim redosledom…</span>`;
    document.querySelectorAll(".placed").forEach(x=>x.onclick=()=>{
      const p=placed.splice(+x.dataset.j,1)[0];
      btns.find(b=>+b.dataset.o===p.o).classList.remove("used");
      redraw();
    });
  }
  btns.forEach(b=>b.onclick=()=>{
    if(b.classList.contains("used")) return;
    placed.push({w:b.dataset.w,o:+b.dataset.o});
    b.classList.add("used"); redraw();
  });
  document.getElementById("reset").onclick=()=>{
    placed=[]; btns.forEach(b=>b.classList.remove("used")); redraw();
    document.getElementById("feedback").className="feedback";
  };
  document.getElementById("showSolution").onclick=()=>{
    const sol=norm(item.w), e=document.getElementById("feedback");
    e.className="feedback show ok";
    e.innerHTML=`Rešenje:<br><b>${sol}</b><br><span style="font-weight:800">${item.tr}</span>`;
    speak(sol);
  };
  document.getElementById("check").onclick=()=>{
    attempts++; updateStats();
    const got=norm(placed.map(x=>x.w)), sol=norm(item.w);
    const e=document.getElementById("feedback");
    const ok = got===sol;
    if(ok) markCorrect();
    e.className="feedback show "+(ok?"ok":"no");
    e.innerHTML=`${ok?"✓ Tačno!":"✗ Nije tačno."}<br><b>${sol}</b><br><span style="font-weight:800">${item.tr}</span>`;
    speak(sol);
  };
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.mode; index=0; render()});
document.getElementById("prev").onclick=()=>{const a=activeArray(); index=(index-1+a.length)%a.length; render()};
document.getElementById("next").onclick=()=>{const a=activeArray(); index=(index+1)%a.length; render()};
window.speechSynthesis.onvoiceschanged=()=>{};
updateStats(); render();
</script>
