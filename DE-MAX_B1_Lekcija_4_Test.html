<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>De-Max B1 • Lekcija 4</title>
<style>
  :root{
    --yellow:#ffd800;
    --yellow2:#fff5b3;
    --ink:#171717;
    --muted:#6f6f6f;
    --line:#eadb7f;
    --white:#ffffff;
    --green:#168a45;
    --greenbg:#e9f8ef;
    --red:#c92d2d;
    --redbg:#fff0f0;
    --shadow:0 14px 40px rgba(34,27,0,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,216,0,.20), transparent 26rem),
      linear-gradient(180deg,#fffdf2 0%,#fff 36%,#fffaf0 100%);
    color:var(--ink);
    min-height:100vh;
  }
  button{font:inherit}
  .app{
    width:min(100%, 760px);
    margin:0 auto;
    min-height:100vh;
    padding:18px 16px 40px;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    margin:-18px -16px 16px;
    padding:12px 16px;
    background:rgba(255,255,255,.93);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .topline{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    max-width:760px; margin:0 auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px; min-width:0;
  }
  .brandmark{
    width:48px;height:48px;border-radius:15px;
    background:var(--yellow); color:#111;
    display:grid;place-items:center;
    font-weight:1000; letter-spacing:-1px;
    border:2px solid #111;
    box-shadow:4px 4px 0 #111;
    flex:0 0 auto;
  }
  .brandtext{min-width:0}
  .brandtext b{display:block;font-size:17px;line-height:1}
  .brandtext span{font-size:12px;color:var(--muted)}
  .mini-score{
    border-radius:14px;
    padding:9px 11px;
    background:#111;color:#fff;
    font-weight:800;font-size:12px;
    white-space:nowrap;
  }
  .quiz-head{
    display:flex;align-items:center;gap:12px;margin:4px 0 12px;
  }
  .back{
    width:43px;height:43px;border:0;border-radius:14px;background:#111;color:#fff;
    cursor:pointer;font-size:20px;font-weight:900;box-shadow:0 6px 16px #0002;
  }
  .quiz-title{flex:1;min-width:0}
  .quiz-title h2{margin:0 0 2px;font-size:20px}
  .quiz-title div{font-size:12px;color:var(--muted)}
  .counter{
    border-radius:999px;background:var(--yellow);padding:8px 11px;
    font-size:12px;font-weight:1000;border:1px solid #c9ad00;
  }
  .progress{
    height:10px;background:#f2f0e8;border-radius:99px;overflow:hidden;
    border:1px solid #e4e0d3;margin-bottom:14px;
  }
  .progress > div{
    height:100%;width:0;background:linear-gradient(90deg,#111,var(--yellow));
    transition:.25s width;
  }
  .question-card{
    background:#fff;border:1px solid #eee1a7;border-radius:25px;
    padding:20px;box-shadow:var(--shadow);
  }
  .q-label{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff8c5;border:1px solid #ead04a;
    color:#514700;border-radius:999px;padding:6px 10px;
    font-size:11px;font-weight:900;margin-bottom:12px;
  }
  .q-text{
    font-size:21px;line-height:1.35;font-weight:900;
    margin:0 0 17px;letter-spacing:-.25px;
  }
  .options{display:grid;gap:10px}
  .option{
    width:100%;display:flex;align-items:center;gap:11px;text-align:left;
    border:1.5px solid #e5e0cc;border-radius:17px;background:#fff;
    padding:13px 14px;cursor:pointer;font-weight:750;
    transition:.15s background,.15s border-color,.15s transform;
  }
  .option:hover:not(:disabled){transform:translateY(-1px);border-color:#c8ab00;background:#fffdf2}
  .option:disabled{cursor:default}
  .letter{
    width:30px;height:30px;border-radius:10px;background:#111;color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:1000;flex:0 0 auto;
  }
  .option.correct{background:var(--greenbg);border-color:#72c491;color:#0c5f2d}
  .option.correct .letter{background:var(--green)}
  .option.wrong{background:var(--redbg);border-color:#e49a9a;color:#8f1e1e}
  .option.wrong .letter{background:var(--red)}
  .feedback{
    display:none;margin-top:14px;border-radius:17px;padding:13px 14px;
    line-height:1.45;font-size:13px;border:1px solid;
  }
  .feedback.show{display:block}
  .feedback.good{background:var(--greenbg);border-color:#9ed6b2;color:#0b5e2c}
  .feedback.bad{background:var(--redbg);border-color:#efbbbb;color:#8b2020}
  .feedback b{display:block;margin-bottom:3px}
  .next{
    display:none;width:100%;border:0;border-radius:16px;background:#111;color:#fff;
    padding:14px 16px;margin-top:14px;font-weight:950;cursor:pointer;
    box-shadow:0 7px 0 var(--yellow);
  }
  .next.show{display:block}
  .next:active{transform:translateY(3px);box-shadow:0 4px 0 var(--yellow)}
  .result{
    text-align:center;background:#fff;border:1px solid #ebdd8b;border-radius:27px;
    padding:28px 20px;box-shadow:var(--shadow);
  }
  .result .medal{
    width:86px;height:86px;border-radius:28px;background:var(--yellow);
    border:3px solid #111;display:grid;place-items:center;margin:0 auto 14px;
    font-size:35px;box-shadow:7px 7px 0 #111;
  }
  .result h2{margin:0 0 6px;font-size:29px}
  .result p{margin:0;color:var(--muted);font-size:14px}
  .big-score{font-size:54px;font-weight:1000;letter-spacing:-2px;margin:12px 0 1px}
  .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .result-actions button{
    border-radius:15px;padding:13px 10px;font-weight:900;cursor:pointer;
  }
  .again{background:var(--yellow);border:2px solid #111;color:#111}
  .homebtn{background:#111;border:2px solid #111;color:#fff}
  .footer{
    text-align:center;color:#948d6d;font-size:11px;padding:22px 5px 4px;
  }
  @media(min-width:640px){
    .question-card{padding:25px}
    .q-text{font-size:24px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topline">
      <div class="brand">
        <div class="brandmark">DM</div>
        <div class="brandtext">
          <b>DE-MAX B1</b>
          <span>Interaktivni test</span>
        </div>
      </div>
      <div class="mini-score" id="miniScore">20 PITANJA</div>
    </div>
  </div>

  <section class="screen active" id="quizScreen">
    <div class="quiz-head">
      <button class="back" onclick="restartQuiz()" aria-label="Ponovi test">↺</button>
      <div class="quiz-title">
        <h2 id="lessonTitle"></h2>
        <div id="lessonTopics"></div>
      </div>
      <div class="counter" id="counter">1/20</div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="question-card" id="questionCard">
      <div class="q-label" id="qLabel">PITANJE</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="nextBtn" onclick="nextQuestion()">Sledeće pitanje →</button>
    </div>

    <div class="result" id="resultBox" style="display:none">
      <div class="medal">✓</div>
      <h2>Test završen!</h2>
      <p id="resultLesson"></p>
      <div class="big-score" id="bigScore">0%</div>
      <p id="resultText"></p>
      <div class="result-actions">
        <button class="again" onclick="restartQuiz()">Ponovi test</button>
        <button class="homebtn" onclick="restartQuiz()">Ponovi</button>
      </div>
    </div>
    <div class="footer">DE-MAX • B1 nemački jezik • direktno otvaranje testa</div>
  </section>
</div>

<script>
const lesson = {"num": 4, "title": "Lekcija 4", "topics": "9–11. čas • wegen + Genitiv • je … desto/umso • Konjunktiv II", "questions": [{"tag": "WEGEN", "q": "Predlog „wegen“ najčešće traži:", "o": ["Nominativ", "Akkusativ", "Dativ", "Genitiv"], "a": 3, "e": "U materijalu je obrađen „wegen + Genitiv“."}, {"tag": "WEGEN", "q": "Šta znači „wegen“?", "o": ["uprkos", "zbog", "dok", "ako"], "a": 1, "e": "„wegen“ znači „zbog“."}, {"tag": "WEGEN", "q": "Izaberi pravilnu rečenicu.", "o": ["Wegen des Regens bleiben wir zu Hause.", "Wegen dem Regen bleiben wir zu Hause.", "Wegen der Regen bleiben wir zu Hause.", "Wegen den Regen bleiben wir zu Hause."], "a": 0, "e": "Standardno: wegen + genitiv → „des Regens“."}, {"tag": "WEGEN", "q": "Dopuni: „Wegen ___ Arbeit komme ich später.“", "o": ["die", "der", "das", "den"], "a": 1, "e": "„Arbeit“ je ženskog roda → Genitiv: „der Arbeit“."}, {"tag": "WEGEN", "q": "Dopuni: „Wegen ___ Wetters bleiben wir im Haus.“", "o": ["des", "dem", "den", "der"], "a": 0, "e": "„das Wetter“ u genitivu glasi „des Wetters“."}, {"tag": "JE … DESTO", "q": "Koja rečenica je pravilna?", "o": ["Je mehr du lernst, desto besser wirst du.", "Je mehr du lernst, du wirst desto besser.", "Desto besser wirst du, je mehr du lernst.", "Je du mehr lernst, desto besser wirst du."], "a": 0, "e": "Osnovna konstrukcija: je + komparativ…, desto/umso + komparativ…"}, {"tag": "JE … DESTO", "q": "Dopuni: „Je früher du kommst, ___ besser ist es.“", "o": ["wenn", "desto", "obwohl", "damit"], "a": 1, "e": "Pravilno: „Je früher du kommst, desto besser ist es.“"}, {"tag": "JE … DESTO", "q": "Koja reč može stajati umesto „desto“?", "o": ["trotzdem", "umso", "damit", "ob"], "a": 1, "e": "U ovoj konstrukciji mogu stajati „desto“ ili „umso“."}, {"tag": "JE … DESTO", "q": "Dopuni: „Je mehr er übt, ___ sicherer spricht er.“", "o": ["obwohl", "umso", "da", "falls"], "a": 1, "e": "„Je mehr …, umso/desto …“"}, {"tag": "JE … DESTO", "q": "Šta izražava konstrukcija „je … desto/umso“?", "o": ["uzrok i posledicu u sadašnjosti", "poređenje sa posledicom / odnos proporcionalnosti", "želju", "zavisnu rečenicu bez glavne"], "a": 1, "e": "Ona pokazuje kako promena u jednom delu utiče na drugi."}, {"tag": "KONJUNKTIV II", "q": "Konjunktiv II se često koristi za:", "o": ["komande", "želje, pretpostavke i ljubazne predloge", "prošlo vreme", "pasiv"], "a": 1, "e": "U gradivu su obrađeni želja, predlog i rečenice sa „wenn“."}, {"tag": "KONJUNKTIV II", "q": "Koji oblik je pravilan za „haben“ u Konjunktiv II?", "o": ["hat", "hatte", "hätte", "habe"], "a": 2, "e": "haben → hätte."}, {"tag": "KONJUNKTIV II", "q": "Koji oblik je pravilan za „sein“ u Konjunktiv II?", "o": ["sei", "war", "wäre", "bin"], "a": 2, "e": "sein → wäre."}, {"tag": "KONJUNKTIV II", "q": "Dopuni: „Ich ___ gern mehr Zeit.“", "o": ["hätte", "hatte", "habe", "würde"], "a": 0, "e": "Za želju: „Ich hätte gern mehr Zeit.“"}, {"tag": "KONJUNKTIV II", "q": "Dopuni: „Wenn ich reich wäre, ___ ich ein großes Haus kaufen.“", "o": ["kaufe", "kaufte", "würde", "werde"], "a": 2, "e": "Kod nestvarne pogodbe: wenn + Konjunktiv II, gl. rečenica često sa „würde + infinitiv“."}, {"tag": "KONJUNKTIV II", "q": "Koja rečenica je pravilan ljubazan predlog?", "o": ["Du musst mehr lernen.", "Du könntest mehr lernen.", "Du lernst mehr.", "Lernst du mehr?"], "a": 1, "e": "„Du könntest …“ zvuči kao blag predlog."}, {"tag": "KONJUNKTIV II", "q": "Koja rečenica je pravilna?", "o": ["Wenn ich mehr Zeit hätte, würde ich Deutsch lernen.", "Wenn ich mehr Zeit habe, würde ich Deutsch lernen.", "Wenn ich hätte mehr Zeit, würde ich Deutsch lernen.", "Würde ich Deutsch lernen, wenn ich mehr Zeit habe."], "a": 0, "e": "U zavisnoj rečenici sa „wenn“ glagol ide na kraj: „hätte“."}, {"tag": "KONJUNKTIV II", "q": "Dopuni: „An deiner Stelle ___ ich den Bus nehmen.“", "o": ["nehme", "nahm", "würde", "werde"], "a": 2, "e": "Za savet se često koristi „würde + infinitiv“."}, {"tag": "KONJUNKTIV II", "q": "Šta znači: „Wenn ich frei wäre, würde ich reisen.“?", "o": ["Kad budem slobodan, putovaću.", "Da sam slobodan, putovao bih.", "Pošto sam slobodan, putujem.", "Ako sam slobodan, putujem."], "a": 1, "e": "Rečenica izražava nestvarnu pretpostavku / želju."}, {"tag": "KONJUNKTIV II", "q": "Izaberi pravilnu rečenicu.", "o": ["Wäre ich zu Hause, würde ich dir helfen.", "War ich zu Hause, würde ich dir helfen.", "Wenn ich zu Hause bin, würde ich dir helfen.", "Ich wäre helfen dir."], "a": 0, "e": "„wäre“ je oblik Konjunktiva II od „sein“."}]};

let qIndex=0, score=0, answered=false;

const lessonTitle=document.getElementById("lessonTitle");
const lessonTopics=document.getElementById("lessonTopics");
const counter=document.getElementById("counter");
const progressBar=document.getElementById("progressBar");
const qLabel=document.getElementById("qLabel");
const qText=document.getElementById("qText");
const options=document.getElementById("options");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const questionCard=document.getElementById("questionCard");
const resultBox=document.getElementById("resultBox");
const bigScore=document.getElementById("bigScore");
const resultText=document.getElementById("resultText");
const resultLesson=document.getElementById("resultLesson");
const miniScore=document.getElementById("miniScore");

function renderQuestion(){
  const Q=lesson.questions[qIndex];
  answered=false;
  lessonTitle.textContent=lesson.title;
  lessonTopics.textContent=lesson.topics;
  counter.textContent=`${qIndex+1}/${lesson.questions.length}`;
  progressBar.style.width=`${(qIndex/lesson.questions.length)*100}%`;
  qLabel.textContent=Q.tag;
  qText.textContent=Q.q;
  feedback.className="feedback";
  feedback.innerHTML="";
  nextBtn.className="next";
  nextBtn.textContent=qIndex===lesson.questions.length-1 ? "Prikaži rezultat ✓" : "Sledeće pitanje →";
  options.innerHTML="";
  Q.o.forEach((txt,idx)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+idx)}</span><span>${txt}</span>`;
    b.onclick=()=>chooseAnswer(idx,b);
    options.appendChild(b);
  });
  miniScore.textContent=`TAČNO ${score} • ${qIndex+1}/${lesson.questions.length}`;
}

function chooseAnswer(idx, btn){
  if(answered) return;
  answered=true;
  const Q=lesson.questions[qIndex];
  const all=[...document.querySelectorAll(".option")];
  all.forEach(b=>b.disabled=true);
  all[Q.a].classList.add("correct");
  if(idx===Q.a){
    score++;
    btn.classList.add("correct");
    feedback.className="feedback show good";
    feedback.innerHTML=`<b>✓ Tačno!</b>${Q.e}`;
  } else {
    btn.classList.add("wrong");
    feedback.className="feedback show bad";
    feedback.innerHTML=`<b>✕ Nije tačno. Tačan odgovor: ${Q.o[Q.a]}</b>${Q.e}`;
  }
  nextBtn.className="next show";
  progressBar.style.width=`${((qIndex+1)/lesson.questions.length)*100}%`;
  miniScore.textContent=`TAČNO ${score} • ${qIndex+1}/${lesson.questions.length}`;
}

function nextQuestion(){
  if(qIndex<lesson.questions.length-1){
    qIndex++;
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    showResult();
  }
}

function showResult(){
  const pct=Math.round(score/lesson.questions.length*100);
  questionCard.style.display="none";
  resultBox.style.display="block";
  counter.textContent=`${lesson.questions.length}/${lesson.questions.length}`;
  progressBar.style.width="100%";
  resultLesson.textContent=`${lesson.title} • ${score}/${lesson.questions.length} tačnih odgovora`;
  bigScore.textContent=`${pct}%`;
  let msg="Nastavi sa vežbanjem i ponovi delove koji su bili teži.";
  if(pct>=90) msg="Odlično savladano gradivo. Rezultat je veoma visok.";
  else if(pct>=75) msg="Vrlo dobro. Još malo ponavljanja i rezultat može biti odličan.";
  else if(pct>=60) msg="Dobro. Preporuka je da ponoviš pitanja na kojima si pogrešio/la.";
  resultText.textContent=msg;
  miniScore.textContent=`REZULTAT ${pct}%`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function restartQuiz(){
  qIndex=0; score=0; answered=false;
  questionCard.style.display="block";
  resultBox.style.display="none";
  renderQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", () => {
  restartQuiz();
});
</script>
</body>
</html>
