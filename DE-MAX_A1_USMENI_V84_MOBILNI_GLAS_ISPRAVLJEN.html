<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>De-Max A1 Usmeni • V86 pažljivo slušanje učenika</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f8fc;color:#17324d}
#load{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.box{max-width:520px;background:#fff;border:1px solid #dce8f5;border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(29,77,125,.10)}
.logo{font-size:30px;font-weight:1000;color:#0b5ed7}.logo span{color:#e53935}
.msg{margin-top:10px;font-weight:800;line-height:1.5}.err{color:#c8231e}
</style>
</head>
<body>
<div id="load"><div class="box"><div class="logo">De-<span>Max</span></div><div class="msg" id="msg">Učitavam V86 — pažljivo slušanje učenika…</div></div></div>
<script>
(async function(){
  const msg=document.getElementById("msg");
  try{
    const response=await fetch("./DE-MAX_A1_USMENI_V83_MOBILE.html?v=86-patient-listen-2",{cache:"no-store"});
    if(!response.ok)throw new Error("Osnovna V83 aplikacija nije dostupna ("+response.status+").");
    let html=await response.text();
    let changes=0;

    const oldAppend=/function appendFinalSpeechSegment\(existing, segment\)\{[\s\S]*?\n\}\n\nfunction setupRec\(\)\{/;
    const newAppend=[
      'function mobileSpeechClient(){',
      '  const ua=String(navigator.userAgent||"");',
      '  return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints>1 && Math.min(screen.width||9999,innerWidth||9999)<=900);',
      '}',
      'function speechSegmentWords(text){',
      '  return String(text||"").toLowerCase().replace(/[.!?,;:]+/g," ").replace(/\\s+/g," ").trim().split(" ").filter(Boolean);',
      '}',
      'function appendFinalSpeechSegment(existing, segment){',
      '  const prev=String(existing||"").trim();',
      '  const next=String(segment||"").trim();',
      '  if(!next)return prev;',
      '  if(!prev)return next;',
      '  const pw=speechSegmentWords(prev), nw=speechSegmentWords(next);',
      '  const pn=pw.join(" "), nn=nw.join(" ");',
      '  if(nn && pn===nn)return prev;',
      '  if(nn && pn.endsWith(nn))return prev;',
      '  if(pn && nn.startsWith(pn))return next;',
      '  let overlap=0;',
      '  const max=Math.min(12,pw.length,nw.length);',
      '  for(let k=max;k>=1;k--){',
      '    if(pw.slice(-k).join(" ")===nw.slice(0,k).join(" ")){overlap=k;break}',
      '  }',
      '  let fresh=next;',
      '  if(overlap){',
      '    const rawNext=next.split(/\\s+/);',
      '    fresh=rawNext.slice(overlap).join(" ").trim();',
      '    if(!fresh)return prev;',
      '  }',
      '  if(startsLikeNewGermanSentence(fresh)){',
      '    const closed=/[.!?:]$/.test(prev) ? prev : prev+".";',
      '    return (closed+" "+fresh).trim();',
      '  }',
      '  return (prev+" "+fresh).replace(/\\s+/g," ").trim();',
      '}',
      '',
      '/* ===== V84 • MOBILNI ASR: bez dopisivanja i dupliranja govora ===== */',
      'function setupRec(){'
    ].join("\n");
    if(oldAppend.test(html)){html=html.replace(oldAppend,newAppend);changes++;}

    const oldInit='  const r=new SR();r.lang="de-DE";r.interimResults=true;r.continuous=true;r.maxAlternatives=10;';
    const newInit=[
      '  const mobileASR=mobileSpeechClient();',
      '  const r=new SR();',
      '  r.lang="de-DE";',
      '  r.interimResults=true;',
      '  // V85: na telefonu ne prekidaj prepoznavanje posle prve kratke pauze.\n  r.continuous=true;',
      '  // Više nemačkih alternativa poboljšava prepoznavanje imena i kraćih A1 odgovora.\n  r.maxAlternatives=mobileASR?5:10;',
      '  let lastMobileFinalNorm="";',
      '  let lastMobileFinalAt=0;'
    ].join("\n");
    if(html.includes(oldInit)){html=html.replace(oldInit,newInit);changes++;}

    const oldBest=[
      '      const best=ranked[0]?.cand||result[0];',
      '      const tx=best.transcript;',
      '      recognitionBestAlternatives=ranked.slice(0,5).map(x=>x.cand.transcript);'
    ].join("\n");
    const newBest=[
      '      // Telefon: koristi primarni rezultat browsera; ne dozvoli bazi da izabere dužu pretpostavljenu rečenicu.',
      '      const best=mobileASR ? result[0] : (ranked[0]?.cand||result[0]);',
      '      const tx=String(best?.transcript||"").trim();',
      '      recognitionBestAlternatives=(mobileASR',
      '        ? Array.from(result).slice(0,3).map(x=>x.transcript)',
      '        : ranked.slice(0,5).map(x=>x.cand.transcript));'
    ].join("\n");
    if(html.includes(oldBest)){html=html.replace(oldBest,newBest);changes++;}

    const oldFinal='      if(result.isFinal){\n        const rawConf=Number(best.confidence)||0;';
    const newFinal=[
      '      if(result.isFinal){',
      '        if(mobileASR){',
      '          const now=performance.now();',
      '          const norm=normalizeSpeechMatchText(tx);',
      '          if(norm && norm===lastMobileFinalNorm && now-lastMobileFinalAt<3000)continue;',
      '          lastMobileFinalNorm=norm;',
      '          lastMobileFinalAt=now;',
      '        }',
      '        const rawConf=Number(best.confidence)||0;'
    ].join("\n");
    if(html.includes(oldFinal)){html=html.replace(oldFinal,newFinal);changes++;}

    const oldEnd='    heardSpeech=false;\n    rec=null;';
    const newEnd=[
      '    heardSpeech=false;',
      '    // Na telefonu nepotvrđeni interim tekst ne ulazi u konačan odgovor ako finalni govor već postoji.',
      '    if(mobileSpeechClient() && String(finalText||"").trim()){',
      '      interimText="";',
      '      renderRecTarget();',
      '    }',
      '    rec=null;'
    ].join("\n");
    if(html.includes(oldEnd)){html=html.replace(oldEnd,newEnd);changes++;}

    /* ===== V86 • PAŽLJIVO SLUŠANJE: duža pauza + zaštita od mobilnog auto-end ===== */
    const oldSilence=/function silenceMsForMode\\(mode\\)\\{[\\s\\S]*?\\n\\}/;
    const newSilence=[
      'function silenceMsForMode(mode){',
      '  // V86: odgovor se obrađuje tek kada učenik zaista završi i napravi dužu pauzu.',
      '  if(mode==="pic")return 10000;',
      '  if(mode==="picRetry")return 5500;',
      '  if(mode==="chat")return 5200;',
      '  if(mode==="topicQ")return 5000;',
      '  if(mode==="topicRetry")return 4800;',
      '  if(mode==="topicMainRetry")return 5000;',
      '  if(mode==="roleChoice")return 5000;',
      '  if(mode==="topic")return 6000;',
      '  if(mode==="intro")return 5800;',
      '  if(mode==="topicChoice")return 5200;',
      '  return 5200;',
      '}'
    ].join("\\n");
    if(oldSilence.test(html)){html=html.replace(oldSilence,newSilence);changes++;}

    const oldArmModes='["intro","topicChoice","topic","topicQ","topicRetry","topicMainRetry","chat","pic","roleChoice"]';
    const newArmModes='["intro","topicChoice","topic","topicQ","topicRetry","topicMainRetry","chat","pic","picRetry","roleChoice"]';
    if(html.includes(oldArmModes)){html=html.replace(oldArmModes,newArmModes);changes++;}

    // Svaki namerni stop (duža tišina ili klik korisnika) obeležava se da onend sme da obradi odgovor.
    const stopNeedle='try{rec.stop()}catch(e){}';
    if(html.includes(stopNeedle)){
      html=html.split(stopNeedle).join('window.__demaxStopRequested=true;try{rec.stop()}catch(e){}');
      changes++;
    }

    // Kada mobilni browser sam zatvori SpeechRecognition, ne obrađuj odmah odgovor.
    // Ponovo uključi slušanje i sačekaj punu V86 pauzu; postojeći tekst ostaje sačuvan.
    const endNeedle='    heardSpeech=false;\\n    // Na telefonu nepotvrđeni interim tekst ne ulazi u konačan odgovor ako finalni govor već postoji.\\n    if(mobileSpeechClient() && String(finalText||"").trim()){\\n      interimText="";\\n      renderRecTarget();\\n    }\\n    rec=null;';
    const endReplacement=[
      '    const requestedStop=!!window.__demaxStopRequested;',
      '    const resumeMode=endedMode;',
      '    if(mobileSpeechClient() && !requestedStop && resumeMode && (window.__demaxUnexpectedEndCount||0)<3){',
      '      window.__demaxUnexpectedEndCount=(window.__demaxUnexpectedEndCount||0)+1;',
      '      rec=null;',
      '      setTimeout(()=>{',
      '        if(rec || recMode!==resumeMode)return;',
      '        window.__demaxStopRequested=false;',
      '        rec=setupRec();',
      '        if(!rec)return;',
      '        document.querySelectorAll(".mic").forEach(b=>b.classList.add("live"));',
      '        try{rec.start()}catch(e){}',
      '        clearSpeechSilence();',
      '        speechSilenceTimer=setTimeout(()=>{',
      '          if(rec && recMode===resumeMode){',
      '            window.__demaxStopRequested=true;',
      '            try{rec.stop()}catch(e){}',
      '          }',
      '        },silenceMsForMode(resumeMode));',
      '      },140);',
      '      return;',
      '    }',
      '    window.__demaxStopRequested=false;',
      '    window.__demaxUnexpectedEndCount=0;',
      '    heardSpeech=false;',
      '    // Na telefonu nepotvrđeni interim tekst ne ulazi u konačan odgovor ako finalni govor već postoji.',
      '    if(mobileSpeechClient() && String(finalText||"").trim()){',
      '      interimText="";',
      '      renderRecTarget();',
      '    }',
      '    rec=null;'
    ].join("\\n");
    if(html.includes(endNeedle)){html=html.replace(endNeedle,endReplacement);changes++;}

    // Novi pravi rezultat znači da učenik i dalje govori: resetuj brojač slučajnih prekida.
    const resultNeedle='  r.onresult=e=>{\\n    lastSpeechResultCount++;';
    const resultReplacement='  r.onresult=e=>{\\n    window.__demaxUnexpectedEndCount=0;\\n    lastSpeechResultCount++;';
    if(html.includes(resultNeedle)){html=html.replace(resultNeedle,resultReplacement);changes++;}

    // Pri svakom potpuno novom odgovoru poništi zastavice prethodne sesije.
    const startNeedle='  recMode=mode;finalText="";interimText="";heardSpeech=false;recognitionUncertain=false;';
    const startReplacement='  window.__demaxStopRequested=false;window.__demaxUnexpectedEndCount=0;\\n  recMode=mode;finalText="";interimText="";heardSpeech=false;recognitionUncertain=false;';
    if(html.includes(startNeedle)){html=html.replace(startNeedle,startReplacement);changes++;}

    html=html.replace(/<title>[\\s\\S]*?<\\/title>/i,'<title>De-Max A1 Usmeni • V86 pažljivo slušanje</title>');

    if(changes<11){
      throw new Error("V86 glasovna ispravka nije mogla bezbedno da se primeni na V83 bazu ("+changes+"/11 izmena).");
    }

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    msg.classList.add("err");
    msg.textContent="Greška pri učitavanju aplikacije: "+(err&&err.message?err.message:err);
  }
})();
</script>
</body>
</html>
