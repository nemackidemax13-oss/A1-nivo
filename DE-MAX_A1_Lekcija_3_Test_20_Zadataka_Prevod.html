</style></head><body><main class="app"><section class="header"><button class="fullscreenToggle" id="fullscreenToggle" type="button" title="Ceo ekran" aria-label="Otvori ceo ekran" hidden>⛶</button><div class="brand"><div class="logo"><span class="brandTop">DE-MAX</span><span class="brandBottom">TUTIN</span></div><div class="badge">A1 TEST</div></div><h1>A1 • Lekcija 3 • Test</h1><div class="sub">Časovi 7–9 • 20 zadataka</div><div class="progressRow"><div class="bar"><div id="barFill"></div></div><div class="count" id="num">1 / 20</div></div></section><section class="card" id="mainCard"><div class="kicker" id="type"></div><div class="q" id="question"></div><div id="content"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev" type="button">← Nazad</button><button class="btn secondary" id="check" type="button">Proveri</button><button class="btn primary" id="next" type="button">Sledeće →</button></div></section><div class="footerStat" id="footerStat"><span class="pill" id="scoreNow">Tačno: 0</span><span>Dodirni odgovor • mobilno 9:16</span></div></main><script>
const questions = [{"type": "mcq", "q": "Dopuni: Das ist ___ Mann.", "options": ["ein", "eine", "einen", "—"], "answer": "ein"}, {"type": "mcq", "q": "Dopuni: Das ist ___ Frau.", "options": ["eine", "ein", "einen", "—"], "answer": "eine"}, {"type": "mcq", "q": "Dopuni: Das ist ___ Kind.", "options": ["ein", "eine", "einen", "—"], "answer": "ein"}, {"type": "mcq", "q": "Koji neodređeni član stoji uz množinu?", "options": ["nema člana", "ein", "eine", "einen"], "answer": "nema člana"}, {"type": "mcq", "q": "Negiraj: Das ist ein Mann.", "options": ["Das ist kein Mann.", "Das ist keine Mann.", "Das ist nicht ein Mann.", "Das kein ist Mann."], "answer": "Das ist kein Mann."}, {"type": "mcq", "q": "Negiraj: Das ist eine Frau.", "options": ["Das ist keine Frau.", "Das ist kein Frau.", "Das ist nicht Frau.", "Das keine ist Frau."], "answer": "Das ist keine Frau."}, {"type": "mcq", "q": "Negiraj: Das ist ein Kind.", "options": ["Das ist kein Kind.", "Das ist keine Kind.", "Das ist keinen Kind.", "Das ist nicht Kind."], "answer": "Das ist kein Kind."}, {"type": "mcq", "q": "Negiraj množinu: Das sind Kinder.", "options": ["Das sind keine Kinder.", "Das sind kein Kinder.", "Das ist keine Kinder.", "Das sind nicht ein Kinder."], "answer": "Das sind keine Kinder."}, {"type": "mcq", "q": "Dopuni: Ich ___ Brot.", "options": ["esse", "isst", "essen", "esst"], "answer": "esse"}, {"type": "mcq", "q": "Dopuni: Du ___ Pizza.", "options": ["isst", "esse", "essen", "esst"], "answer": "isst"}, {"type": "mcq", "q": "Dopuni: Wir ___ Salat.", "options": ["essen", "isst", "esst", "esse"], "answer": "essen"}, {"type": "mcq", "q": "Dopuni: Ich ___ Wasser.", "options": ["trinke", "trinkst", "trinkt", "trinken"], "answer": "trinke"}, {"type": "mcq", "q": "Dopuni: Du ___ Saft.", "options": ["trinkst", "trinke", "trinkt", "trinken"], "answer": "trinkst"}, {"type": "mcq", "q": "Koje pitanje znači „Šta je tvoje omiljeno jelo?“", "options": ["Was ist dein Lieblingsessen?", "Was trinkst du gern?", "Wie geht es dir?", "Woher kommst du?"], "answer": "Was ist dein Lieblingsessen?"}, {"type": "order", "q": "Sastavi odgovor: „Moje omiljeno jelo je pica.“", "words": ["ist", "Pizza", "Mein", "Lieblingsessen", "."], "answer": ["Mein", "Lieblingsessen", "ist", "Pizza", "."], "translation": "Moje omiljeno jelo je pica."}, {"type": "mcq", "q": "Dopuni: Ich ___ Wasser.", "options": ["brauche", "brauchst", "braucht", "brauchen"], "answer": "brauche"}, {"type": "mcq", "q": "Dopuni: Du ___ ein Heft.", "options": ["brauchst", "brauche", "braucht", "brauchen"], "answer": "brauchst"}, {"type": "mcq", "q": "Dopuni: Wir ___ mehr Zeit.", "options": ["brauchen", "braucht", "brauchst", "brauche"], "answer": "brauchen"}, {"type": "mcq", "q": "Koji oblik je pravilan uz „mit“: „Idem kolima.“", "options": ["Ich fahre mit dem Auto.", "Ich fahre mit das Auto.", "Ich fahre mit der Auto.", "Ich fahre mit den Auto."], "answer": "Ich fahre mit dem Auto."}, {"type": "order", "q": "Sastavi pitanje sa glagolom „brauchen“.", "words": ["du", "Was", "brauchst", "?"], "answer": ["Was", "brauchst", "du", "?"], "translation": "Šta ti treba?"}];
let idx=0, score=0;
const answered = Array(questions.length).fill(false);
const results = Array(questions.length).fill(null);
let assembled=[];
const el = id => document.getElementById(id);
let feedbackAudioContext = null;
function playFeedbackSound(correct){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!feedbackAudioContext) feedbackAudioContext = new Ctx();
    if(feedbackAudioContext.state === 'suspended') void feedbackAudioContext.resume();
    const start = feedbackAudioContext.currentTime + 0.015;
    const notes = correct
      ? [[523.25,0,0.11],[659.25,0.12,0.11],[783.99,0.24,0.19]]
      : [[300,0,0.15],[215,0.18,0.23]];
    notes.forEach(([frequency, offset, duration]) => {
      const oscillator = feedbackAudioContext.createOscillator();
      const volume = feedbackAudioContext.createGain();
      oscillator.type = correct ? 'sine' : 'triangle';
      oscillator.frequency.setValueAtTime(frequency, start + offset);
      volume.gain.setValueAtTime(0.001, start + offset);
      volume.gain.exponentialRampToValueAtTime(correct ? 0.095 : 0.075, start + offset + 0.015);
      volume.gain.exponentialRampToValueAtTime(0.001, start + offset + duration);
      oscillator.connect(volume);
      volume.connect(feedbackAudioContext.destination);
      oscillator.start(start + offset);
      oscillator.stop(start + offset + duration + 0.01);
    });
  }catch(err){ /* Audio is optional if the browser does not allow playback. */ }
}

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){
  const q=questions[idx]; assembled=[];
  el('num').textContent=`${idx+1} / ${questions.length}`;
  el('barFill').style.width=`${((idx)/questions.length)*100}%`;
  el('scoreNow').textContent=`Tačno: ${score}`;
  el('type').textContent=q.type==='order'?'Sastavi rečenicu':'Odaberi odgovor';
  el('question').innerHTML=esc(q.q);
  el('content').innerHTML=''; el('feedback').className='feedback'; el('feedback').textContent='';
  el('check').style.display=q.type==='order'?'block':'none';
  el('next').disabled=!answered[idx];
  if(q.type==='mcq') renderMCQ(q); else renderOrder(q);
}
function renderMCQ(q){
  const wrap=document.createElement('div'); wrap.className='options';
  q.options.forEach(o=>{const b=document.createElement('button'); b.className='opt'; b.textContent=o; b.onclick=()=>chooseMCQ(b,o,q); wrap.appendChild(b);});
  el('content').appendChild(wrap);
  if(answered[idx]) restoreMCQ(q,wrap);
}
function chooseMCQ(btn,val,q){
  if(answered[idx]) return;
  answered[idx]=true; results[idx]=(val===q.answer); if(results[idx]) score++; playFeedbackSound(results[idx]);
  [...btn.parentElement.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct'); else if(b===btn)b.classList.add('wrong'); else b.classList.add('dim');});
  showFeedback(results[idx], q.answer); el('next').disabled=false; el('scoreNow').textContent=`Tačno: ${score}`;
}
function restoreMCQ(q,wrap){
  [...wrap.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct'); else b.classList.add('dim');});
  showFeedback(results[idx], q.answer);
}
function renderOrder(q){
  const a=document.createElement('div');a.className='assembled';a.id='assembled';
  const bank=document.createElement('div');bank.className='wordbank';bank.id='bank';
  el('content').appendChild(a);el('content').appendChild(bank);
  if(answered[idx]){ assembled=[...q.answer]; drawOrder(q,true); showFeedback(results[idx],q.answer.join(' '),results[idx]?q.translation:null); el('check').disabled=true; el('next').disabled=false; }
  else { drawOrder(q,false); el('check').disabled=false; }
}
function drawOrder(q,locked=false){
  const a=el('assembled'), bank=el('bank'); a.innerHTML=''; bank.innerHTML='';
  if(!assembled.length){const p=document.createElement('span');p.className='placeholder';p.textContent='Dodirni reči redom…';a.appendChild(p);} 
  assembled.forEach((w,i)=>{const b=document.createElement('button');b.className='word';b.textContent=w;if(!locked)b.onclick=()=>{assembled.splice(i,1);drawOrder(q,false)};a.appendChild(b);});
  if(!locked){
    const used={}; assembled.forEach(w=>used[w]=(used[w]||0)+1);
    q.words.forEach(w=>{ const total=q.words.filter(x=>x===w).length, u=used[w]||0; if(u<total){used[w]=u+1; const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{assembled.push(w);drawOrder(q,false)};bank.appendChild(b);} });
  }
}
function checkOrder(){
  if(answered[idx]) return; const q=questions[idx]; const ok=assembled.join('\u0001')===q.answer.join('\u0001');
  answered[idx]=true; results[idx]=ok; if(ok)score++; playFeedbackSound(ok); showFeedback(ok,q.answer.join(' '),ok?q.translation:null);
  if(!ok){assembled=[...q.answer]; drawOrder(q,true);} else drawOrder(q,true);
  el('check').disabled=true; el('next').disabled=false; el('scoreNow').textContent=`Tačno: ${score}`;
}
function showFeedback(ok,ans,translation=null){
  const f=el('feedback');
  f.className='feedback '+(ok?'ok':'bad');
  if(ok){
    f.innerHTML='✓ Tačno!'+(translation?'<span class="translationLine">Prevod: '+esc(translation)+'</span>':'');
  }else{
    f.textContent='✗ Tačan odgovor: '+ans;
  }
}
function next(){ if(idx<questions.length-1){idx++;render();} else finish(); }
function prev(){ if(idx>0){idx--;render();} }
function finish(){
  const pct=Math.round(score/questions.length*100); el('barFill').style.width='100%';
  el('mainCard').innerHTML=`<div class="result"><div class="kicker">Rezultat</div><div class="scoreCircle" style="--pct:${pct}%"><div class="scoreText">${pct}%</div></div><h2>${score} / ${questions.length} tačno</h2><p>${pct>=90?'Odlično!':pct>=70?'Vrlo dobro!':pct>=50?'Dobro — ponovi još malo gradivo.':'Ponovi gradivo i pokušaj ponovo.'}</p><button class="btn primary" onclick="restart()">Uradi test ponovo</button></div>`;
  el('footerStat').style.display='none';
}
function restart(){location.reload();}
el('check').onclick=checkOrder; el('next').onclick=next; el('prev').onclick=prev; render();


/* Use the entire usable phone screen without page scrolling. */
let mobileFitPending=false;
function fitMobileA1(){
 const app=document.querySelector('main.app');
 if(!app)return;
 if(!window.matchMedia('(max-width:700px)').matches){
  app.style.removeProperty('--a1-viewport-height');
  app.removeAttribute('data-a1-compact');
  return;
 }
 const viewport=window.visualViewport;
 const screenHeight=Math.max(1,Math.floor(Math.min(window.innerHeight,viewport?viewport.height:window.innerHeight)));
 app.style.setProperty('--a1-viewport-height',screenHeight+'px');
 app.dataset.a1Compact=screenHeight<510?'2':screenHeight<675?'1':'0';
 // All questions, controls and feedback remain within the usable screen.
 const card=document.getElementById('mainCard');
 if(card && card.scrollHeight>card.clientHeight+2)app.dataset.a1Compact='2';
}
function scheduleMobileA1(){
 if(mobileFitPending)return;
 mobileFitPending=true;
 requestAnimationFrame(()=>{mobileFitPending=false;fitMobileA1();});
}
new MutationObserver(scheduleMobileA1).observe(document.querySelector('main.app'),{subtree:true,childList:true,characterData:true});
window.addEventListener('resize',scheduleMobileA1,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleMobileA1,{passive:true});
window.addEventListener('pageshow',scheduleMobileA1);
function toggleA1Fullscreen(){
 if(document.fullscreenElement){if(document.exitFullscreen)void document.exitFullscreen();return;}
 const node=document.documentElement;
 if(node.requestFullscreen)void node.requestFullscreen().catch(()=>{});
}
const fullScreenButton=document.getElementById('fullscreenToggle');
if(fullScreenButton){
 const supported=!!document.documentElement.requestFullscreen;
 fullScreenButton.hidden=!supported;
 fullScreenButton.addEventListener('click',toggleA1Fullscreen);
 document.addEventListener('fullscreenchange',()=>{
  fullScreenButton.textContent=document.fullscreenElement?'⤢':'⛶';
  fullScreenButton.setAttribute('aria-label',document.fullscreenElement?'Izađi iz celog ekrana':'Otvori ceo ekran');
  scheduleMobileA1();
 });
}
scheduleMobileA1();
