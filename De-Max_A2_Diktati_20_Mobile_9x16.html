<script>
const data = [{"title": "1. Diktat – Vorstellung", "lines": [{"de": "A: Hallo, ich heiße Amir und komme aus Serbien.", "sr": "A: Zdravo, zovem se Amir i dolazim iz Srbije."}, {"de": "B: Freut mich, ich bin Lara und wohne seit zwei Jahren in Berlin.", "sr": "B: Drago mi je, ja sam Lara i već dve godine živim u Berlinu."}, {"de": "A: Ich habe gehört, dass du Deutsch lernst.", "sr": "A: Čuo sam da učiš nemački."}, {"de": "B: Ja, ich lerne Deutsch, weil ich hier arbeiten möchte.", "sr": "B: Da, učim nemački jer želim ovde da radim."}, {"de": "A: Wenn ich Zeit habe, übe ich jeden Abend.", "sr": "A: Kada imam vremena, vežbam svake večeri."}, {"de": "B: Gestern habe ich zwei Stunden gelernt.", "sr": "B: Juče sam učila dva sata."}, {"de": "A: Früher konnte ich nur wenige Wörter sagen.", "sr": "A: Ranije sam mogao da kažem samo nekoliko reči."}, {"de": "B: Ich musste am Anfang sehr langsam sprechen.", "sr": "B: Na početku sam morala da govorim veoma sporo."}, {"de": "A: Weißt du, ob der Kurs schwer ist?", "sr": "A: Znaš li da li je kurs težak?"}, {"de": "B: Er ist manchmal schwer, trotzdem macht er mir Spaß.", "sr": "B: Ponekad je težak, ipak mi je zabavan."}, {"de": "A: Ich möchte besser sprechen, deshalb rede ich oft mit Nachbarn.", "sr": "A: Želim bolje da govorim, zato često razgovaram sa komšijama."}, {"de": "B: Letzte Woche habe ich neue Leute kennengelernt.", "sr": "B: Prošle nedelje sam upoznala nove ljude."}, {"de": "A: Ich wollte immer in Deutschland studieren.", "sr": "A: Oduvek sam želeo da studiram u Nemačkoj."}, {"de": "B: Dann wünsche ich dir viel Erfolg!", "sr": "B: Onda ti želim mnogo uspeha!"}]}, {"title": "2. Diktat – Familie", "lines": [{"de": "A: Wie groß ist deine Familie?", "sr": "A: Koliko je velika tvoja porodica?"}, {"de": "B: Wir sind fünf Personen, und ich habe zwei Geschwister.", "sr": "B: Nas je petoro i imam dvoje braće i sestara."}, {"de": "A: Meine Mutter sagt, dass Familie sehr wichtig ist.", "sr": "A: Moja majka kaže da je porodica veoma važna."}, {"de": "B: Wir essen zusammen, wenn alle zu Hause sind.", "sr": "B: Jedemo zajedno kada su svi kod kuće."}, {"de": "A: Am Sonntag haben wir meine Großeltern besucht.", "sr": "A: U nedelju smo posetili baku i deku."}, {"de": "B: Ich bin zu Hause geblieben, weil mein Sohn krank war.", "sr": "B: Ostala sam kod kuće jer mi je sin bio bolestan."}, {"de": "A: Als Kind musste ich meinem Vater oft helfen.", "sr": "A: Kao dete sam često morao da pomažem ocu."}, {"de": "B: Meine Schwester konnte schon mit fünf Jahren lesen.", "sr": "B: Moja sestra je već sa pet godina umela da čita."}, {"de": "A: Weißt du, ob dein Bruder morgen kommt?", "sr": "A: Znaš li da li tvoj brat dolazi sutra?"}, {"de": "B: Er arbeitet lange, trotzdem möchte er kommen.", "sr": "B: Radi dugo, ipak želi da dođe."}, {"de": "A: Wir feiern morgen Geburtstag, deshalb backt meine Mutter einen Kuchen.", "sr": "A: Sutra slavimo rođendan, zato moja majka peče tortu."}, {"de": "B: Meine Tante hat schon ein Geschenk gekauft.", "sr": "B: Moja tetka je već kupila poklon."}, {"de": "A: Früher wollte ich nur ein Kind haben.", "sr": "A: Ranije sam želeo da imam samo jedno dete."}, {"de": "B: Heute finde ich, dass eine große Familie schön ist.", "sr": "B: Danas mislim da je velika porodica lepa."}]}, {"title": "3. Diktat – Einkaufen", "lines": [{"de": "A: Was möchtest du heute kaufen?", "sr": "A: Šta želiš danas da kupiš?"}, {"de": "B: Ich brauche Lebensmittel, weil der Kühlschrank fast leer ist.", "sr": "B: Trebaju mi namirnice jer je frižider skoro prazan."}, {"de": "A: Meine Frau hat gesagt, dass wir Milch und Eier brauchen.", "sr": "A: Moja žena je rekla da nam trebaju mleko i jaja."}, {"de": "B: Wenn Obst im Angebot ist, kaufe ich auch Äpfel.", "sr": "B: Ako je voće na akciji, kupiću i jabuke."}, {"de": "A: Gestern habe ich schon Brot und Käse gekauft.", "sr": "A: Juče sam već kupio hleb i sir."}, {"de": "B: Ich konnte die Tomaten nicht finden.", "sr": "B: Nisam mogao da pronađem paradajz."}, {"de": "A: Du musstest einen Mitarbeiter fragen, oder?", "sr": "A: Morao si da pitaš radnika, zar ne?"}, {"de": "B: Ja, und er hat mir sofort geholfen.", "sr": "B: Da, i odmah mi je pomogao."}, {"de": "A: Weißt du, ob man hier mit Karte zahlen kann?", "sr": "A: Znaš li da li ovde može da se plati karticom?"}, {"de": "B: Ja, aber die Kasse ist voll, trotzdem warten wir.", "sr": "B: Da, ali je kasa puna, ipak ćemo sačekati."}, {"de": "A: Wir haben wenig Zeit, deshalb nehme ich nur das Wichtigste.", "sr": "A: Imamo malo vremena, zato uzimam samo najvažnije."}, {"de": "B: Ich habe auch Waschmittel in den Wagen gelegt.", "sr": "B: Stavila sam i deterdžent u kolica."}, {"de": "A: Früher wollte ich immer bar bezahlen.", "sr": "A: Ranije sam uvek želeo da plaćam gotovinom."}, {"de": "B: Heute zahle ich lieber mit Karte, weil es schneller geht.", "sr": "B: Danas radije plaćam karticom jer je brže."}]}, {"title": "4. Diktat – Haus", "lines": [{"de": "A: Euer Haus sieht sehr schön aus.", "sr": "A: Vaša kuća izgleda veoma lepo."}, {"de": "B: Danke, wir haben es letztes Jahr renoviert.", "sr": "B: Hvala, renovirali smo je prošle godine."}, {"de": "A: Ich sehe, dass ihr neue Fenster habt.", "sr": "A: Vidim da imate nove prozore."}, {"de": "B: Ja, wir haben sie gewechselt, weil die alten kalt waren.", "sr": "B: Da, promenili smo ih jer su stari propuštali hladnoću."}, {"de": "A: Wenn es warm ist, sitzen wir oft im Garten.", "sr": "A: Kada je toplo, često sedimo u bašti."}, {"de": "B: Am Wochenende habe ich dort Blumen gepflanzt.", "sr": "B: Za vikend sam tamo posadila cveće."}, {"de": "A: Früher mussten wir viel im Haus reparieren.", "sr": "A: Ranije smo morali mnogo toga da popravljamo u kući."}, {"de": "B: Mein Mann konnte fast alles selbst machen.", "sr": "B: Moj muž je skoro sve mogao sam da uradi."}, {"de": "A: Weißt du, ob das Dach noch gut ist?", "sr": "A: Znaš li da li je krov još dobar?"}, {"de": "B: Es ist alt, trotzdem regnet es nicht hinein.", "sr": "B: Star je, ipak kiša ne ulazi unutra."}, {"de": "A: Wir sparen Geld, deshalb machen wir die Arbeiten langsam.", "sr": "A: Štedimo novac, zato radove radimo polako."}, {"de": "B: Letzte Woche haben wir die Küche gestrichen.", "sr": "B: Prošle nedelje smo okrečili kuhinju."}, {"de": "A: Ich wollte immer ein Haus mit Terrasse haben.", "sr": "A: Oduvek sam želeo kuću sa terasom."}, {"de": "B: Ich glaube, dass ihr euch hier sehr wohlfühlt.", "sr": "B: Mislim da se ovde osećate veoma prijatno."}]}, {"title": "5. Diktat – Zuhause", "lines": [{"de": "A: Was machst du gern zu Hause?", "sr": "A: Šta voliš da radiš kod kuće?"}, {"de": "B: Ich lese gern, wenn es draußen regnet.", "sr": "B: Volim da čitam kada napolju pada kiša."}, {"de": "A: Meine Frau sagt, dass ich zu viel fernsehe.", "sr": "A: Moja žena kaže da previše gledam televiziju."}, {"de": "B: Ich koche oft, weil meine Kinder warmes Essen mögen.", "sr": "B: Često kuvam jer moja deca vole toplo jelo."}, {"de": "A: Gestern habe ich die ganze Wohnung geputzt.", "sr": "A: Juče sam očistio ceo stan."}, {"de": "B: Ich habe am Abend noch Wäsche gewaschen.", "sr": "B: Uveče sam još oprala veš."}, {"de": "A: Früher musste ich jeden Tag früh aufstehen.", "sr": "A: Ranije sam morao svakog dana rano da ustajem."}, {"de": "B: Am Wochenende konnte ich länger schlafen.", "sr": "B: Vikendom sam mogla duže da spavam."}, {"de": "A: Weißt du, ob die Kinder schon ihre Hausaufgaben gemacht haben?", "sr": "A: Znaš li da li su deca već uradila domaći?"}, {"de": "B: Ja, sie waren müde, trotzdem haben sie alles gemacht.", "sr": "B: Da, bila su umorna, ipak su sve uradila."}, {"de": "A: Morgen kommen Gäste, deshalb räumen wir heute auf.", "sr": "A: Sutra dolaze gosti, zato danas spremamo kuću."}, {"de": "B: Ich habe schon Getränke gekauft.", "sr": "B: Već sam kupila piće."}, {"de": "A: Ich wollte früher eine größere Wohnung haben.", "sr": "A: Ranije sam želeo veći stan."}, {"de": "B: Jetzt finde ich, dass unser Zuhause genau richtig ist.", "sr": "B: Sada mislim da je naš dom baš kako treba."}]}, {"title": "6. Diktat – Freizeit", "lines": [{"de": "A: Was machst du in deiner Freizeit?", "sr": "A: Šta radiš u slobodno vreme?"}, {"de": "B: Ich gehe spazieren, weil ich mich dabei gut entspanne.", "sr": "B: Idem u šetnju jer se tako lepo opustim."}, {"de": "A: Ich weiß, dass du auch gern fotografierst.", "sr": "A: Znam da voliš i da fotografišeš."}, {"de": "B: Ja, wenn das Wetter schön ist, nehme ich meine Kamera mit.", "sr": "B: Da, kada je vreme lepo, ponesem foto-aparat."}, {"de": "A: Letzten Samstag habe ich einen Film gesehen.", "sr": "A: Prošle subote sam gledao film."}, {"de": "B: Ich habe mit Freunden Karten gespielt.", "sr": "B: Igrala sam karte sa prijateljima."}, {"de": "A: Früher konnte ich jeden Abend ausgehen.", "sr": "A: Ranije sam mogao da izlazim svake večeri."}, {"de": "B: Ich musste damals nicht so viel arbeiten.", "sr": "B: Tada nisam morala toliko da radim."}, {"de": "A: Weißt du, ob am Wochenende ein Konzert stattfindet?", "sr": "A: Znaš li da li za vikend ima koncert?"}, {"de": "B: Es soll regnen, trotzdem möchte ich hingehen.", "sr": "B: Trebalo bi da pada kiša, ipak želim da idem."}, {"de": "A: Die Karten sind günstig, deshalb kaufe ich zwei.", "sr": "A: Karte su jeftine, zato kupujem dve."}, {"de": "B: Ich habe schon meine Freundin gefragt.", "sr": "B: Već sam pitala drugaricu."}, {"de": "A: Ich wollte schon lange wieder tanzen gehen.", "sr": "A: Već dugo sam želeo ponovo da idem na ples."}, {"de": "B: Dann hoffe ich, dass wir viel Spaß haben.", "sr": "B: Onda se nadam da ćemo se lepo provesti."}]}, {"title": "7. Diktat – Sport", "lines": [{"de": "A: Treibst du regelmäßig Sport?", "sr": "A: Da li se redovno baviš sportom?"}, {"de": "B: Ja, ich trainiere dreimal pro Woche, weil ich fit bleiben möchte.", "sr": "B: Da, treniram tri puta nedeljno jer želim da ostanem u formi."}, {"de": "A: Mein Trainer sagt, dass Aufwärmen sehr wichtig ist.", "sr": "A: Moj trener kaže da je zagrevanje veoma važno."}, {"de": "B: Wenn ich müde bin, mache ich nur ein leichtes Training.", "sr": "B: Kada sam umoran, radim samo lagani trening."}, {"de": "A: Gestern habe ich eine Stunde Fußball gespielt.", "sr": "A: Juče sam igrao fudbal jedan sat."}, {"de": "B: Ich bin am Sonntag fünf Kilometer gelaufen.", "sr": "B: U nedelju sam trčala pet kilometara."}, {"de": "A: Früher konnte ich viel schneller laufen.", "sr": "A: Ranije sam mogao mnogo brže da trčim."}, {"de": "B: Nach meiner Verletzung musste ich lange pausieren.", "sr": "B: Posle povrede sam morala dugo da pauziram."}, {"de": "A: Weißt du, ob das Fitnessstudio heute offen ist?", "sr": "A: Znaš li da li je teretana danas otvorena?"}, {"de": "B: Ich habe wenig Zeit, trotzdem möchte ich trainieren.", "sr": "B: Imam malo vremena, ipak želim da treniram."}, {"de": "A: Morgen ist ein Spiel, deshalb gehe ich heute früh schlafen.", "sr": "A: Sutra je utakmica, zato danas idem rano da spavam."}, {"de": "B: Unser Team hat letzte Woche gewonnen.", "sr": "B: Naš tim je prošle nedelje pobedio."}, {"de": "A: Als Kind wollte ich Fußballspieler werden.", "sr": "A: Kao dete sam želeo da postanem fudbaler."}, {"de": "B: Heute weiß ich, dass Sport vor allem gesund sein soll.", "sr": "B: Danas znam da sport pre svega treba da bude zdrav."}]}, {"title": "8. Diktat – Deutschland", "lines": [{"de": "A: Warst du schon einmal in Deutschland?", "sr": "A: Da li si već nekada bio u Nemačkoj?"}, {"de": "B: Ja, ich habe letztes Jahr München besucht.", "sr": "B: Da, prošle godine sam posetila Minhen."}, {"de": "A: Ich habe gehört, dass die Stadt sehr schön ist.", "sr": "A: Čuo sam da je grad veoma lep."}, {"de": "B: Mir gefällt Deutschland, weil die Züge oft bequem sind.", "sr": "B: Sviđa mi se Nemačka jer su vozovi često udobni."}, {"de": "A: Wenn ich dort bin, probiere ich gern deutsches Essen.", "sr": "A: Kada sam tamo, volim da probam nemačku hranu."}, {"de": "B: Ich habe in Berlin Currywurst gegessen.", "sr": "B: U Berlinu sam jela kari kobasicu."}, {"de": "A: Früher konnte ich kaum Deutsch verstehen.", "sr": "A: Ranije sam jedva mogao da razumem nemački."}, {"de": "B: Im ersten Monat musste ich oft nachfragen.", "sr": "B: Prvog meseca sam često morala dodatno da pitam."}, {"de": "A: Weißt du, ob Geschäfte sonntags geöffnet sind?", "sr": "A: Znaš li da li su prodavnice otvorene nedeljom?"}, {"de": "B: Viele sind geschlossen, trotzdem findet man offene Bäckereien.", "sr": "B: Mnoge su zatvorene, ipak se mogu naći otvorene pekare."}, {"de": "A: Ich möchte Köln sehen, deshalb plane ich eine Reise.", "sr": "A: Želim da vidim Keln, zato planiram putovanje."}, {"de": "B: Meine Freunde haben mir Hamburg empfohlen.", "sr": "B: Moji prijatelji su mi preporučili Hamburg."}, {"de": "A: Früher wollte ich nur Berlin besuchen.", "sr": "A: Ranije sam želeo da posetim samo Berlin."}, {"de": "B: Jetzt finde ich, dass jede Region interessant ist.", "sr": "B: Sada mislim da je svaka regija zanimljiva."}]}, {"title": "9. Diktat – Beim Arzt", "lines": [{"de": "A: Guten Morgen, was fehlt Ihnen?", "sr": "A: Dobro jutro, šta vam je?"}, {"de": "B: Ich habe starke Halsschmerzen und fühle mich müde.", "sr": "B: Imam jake bolove u grlu i osećam se umorno."}, {"de": "A: Ich glaube, dass Sie eine Erkältung haben.", "sr": "A: Mislim da imate prehladu."}, {"de": "B: Ich bin gekommen, weil ich seit gestern Fieber habe.", "sr": "B: Došao sam jer od juče imam temperaturu."}, {"de": "A: Wenn Sie Fieber haben, sollen Sie viel trinken.", "sr": "A: Ako imate temperaturu, treba mnogo da pijete."}, {"de": "B: Heute Morgen habe ich schon Tee getrunken.", "sr": "B: Jutros sam već pio čaj."}, {"de": "A: Konnten Sie letzte Nacht gut schlafen?", "sr": "A: Da li ste prošle noći mogli dobro da spavate?"}, {"de": "B: Nein, ich musste oft husten.", "sr": "B: Ne, morao sam često da kašljem."}, {"de": "A: Wissen Sie, ob Sie gegen Medikamente allergisch sind?", "sr": "A: Znate li da li ste alergični na lekove?"}, {"de": "B: Nein, ich bin müde, trotzdem muss ich heute arbeiten.", "sr": "B: Ne, umoran sam, ipak danas moram da radim."}, {"de": "A: Sie sind krank, deshalb sollten Sie zu Hause bleiben.", "sr": "A: Bolesni ste, zato bi trebalo da ostanete kod kuće."}, {"de": "B: Ich habe meinem Chef schon Bescheid gesagt.", "sr": "B: Već sam obavestio šefa."}, {"de": "A: Früher wollte ich nie zum Arzt gehen.", "sr": "A: Ranije nikada nisam želeo da idem kod lekara."}, {"de": "B: Jetzt weiß ich, dass Gesundheit wichtiger ist.", "sr": "B: Sada znam da je zdravlje važnije."}]}, {"title": "10. Diktat – In der Bäckerei", "lines": [{"de": "A: Guten Morgen, was darf es sein?", "sr": "A: Dobro jutro, izvolite?"}, {"de": "B: Ich hätte gern zwei Brötchen und ein Brot.", "sr": "B: Želeo bih dve zemičke i jedan hleb."}, {"de": "A: Wir haben heute Brot, das besonders frisch ist.", "sr": "A: Danas imamo hleb koji je posebno svež."}, {"de": "B: Ich nehme es, weil meine Familie dunkles Brot mag.", "sr": "B: Uzeću ga jer moja porodica voli tamni hleb."}, {"de": "A: Wenn Sie möchten, kann ich es schneiden.", "sr": "A: Ako želite, mogu da ga isečem."}, {"de": "B: Danke, gestern habe ich hier auch Kuchen gekauft.", "sr": "B: Hvala, juče sam ovde kupio i kolač."}, {"de": "A: Früher konnten wir nur bar bezahlen.", "sr": "A: Ranije smo mogli da plaćamo samo gotovinom."}, {"de": "B: Ich musste deshalb immer Geld dabeihaben.", "sr": "B: Zato sam uvek morao da imam novac kod sebe."}, {"de": "A: Wissen Sie, ob ich jetzt mit Karte zahlen kann?", "sr": "A: Znate li da li sada mogu da platim karticom?"}, {"de": "B: Ja, das Gerät ist langsam, trotzdem funktioniert es.", "sr": "B: Da, aparat je spor, ipak radi."}, {"de": "A: Ich habe es eilig, deshalb nehme ich keinen Kaffee.", "sr": "A: Žurim, zato neću uzeti kafu."}, {"de": "B: Wir haben gerade frische Croissants gebacken.", "sr": "B: Upravo smo ispekli sveže kroasane."}, {"de": "A: Eigentlich wollte ich nur Brot kaufen.", "sr": "A: Zapravo sam hteo da kupim samo hleb."}, {"de": "B: Ich glaube, dass ein Croissant auch noch passt.", "sr": "B: Mislim da može još i jedan kroasan."}]}, {"title": "11. Diktat – Im Modegeschäft", "lines": [{"de": "A: Kann ich Ihnen helfen?", "sr": "A: Mogu li da vam pomognem?"}, {"de": "B: Ja, ich suche eine Jacke, weil es draußen kalt ist.", "sr": "B: Da, tražim jaknu jer je napolju hladno."}, {"de": "A: Ich denke, dass diese Jacke gut zu Ihnen passt.", "sr": "A: Mislim da vam ova jakna lepo stoji."}, {"de": "B: Wenn sie nicht zu teuer ist, probiere ich sie an.", "sr": "B: Ako nije preskupa, probaću je."}, {"de": "A: Wir haben heute viele Preise reduziert.", "sr": "A: Danas smo snizili mnogo cena."}, {"de": "B: Gestern habe ich schon eine Hose gekauft.", "sr": "B: Juče sam već kupio pantalone."}, {"de": "A: Früher konnte ich Größe M tragen.", "sr": "A: Ranije sam mogao da nosim veličinu M."}, {"de": "B: Jetzt musste ich eine größere Größe nehmen.", "sr": "B: Sada sam morao da uzmem veću veličinu."}, {"de": "A: Wissen Sie, ob es die Jacke auch in Schwarz gibt?", "sr": "A: Znate li da li ova jakna postoji i u crnoj boji?"}, {"de": "B: Sie ist etwas eng, trotzdem gefällt sie mir.", "sr": "B: Malo je tesna, ipak mi se sviđa."}, {"de": "A: Die blaue ist weiter, deshalb zeige ich Ihnen diese.", "sr": "A: Plava je šira, zato ću vam pokazati nju."}, {"de": "B: Ich habe sie anprobiert und sie sitzt sehr gut.", "sr": "B: Probao sam je i veoma lepo stoji."}, {"de": "A: Ich wollte eigentlich eine schwarze Jacke.", "sr": "A: Zapravo sam želeo crnu jaknu."}, {"de": "B: Jetzt sehe ich, dass Blau auch gut aussieht.", "sr": "B: Sada vidim da i plava dobro izgleda."}]}, {"title": "12. Diktat – Im Blumenladen", "lines": [{"de": "A: Guten Tag, ich brauche einen Blumenstrauß.", "sr": "A: Dobar dan, treba mi buket cveća."}, {"de": "B: Für wen ist der Strauß?", "sr": "B: Za koga je buket?"}, {"de": "A: Für meine Mutter, weil sie heute Geburtstag hat.", "sr": "A: Za moju majku, jer joj je danas rođendan."}, {"de": "B: Ich finde, dass rote Rosen immer schön sind.", "sr": "B: Mislim da su crvene ruže uvek lepe."}, {"de": "A: Wenn Sie möchten, mische ich Rosen und Tulpen.", "sr": "A: Ako želite, pomešaću ruže i lale."}, {"de": "B: Letztes Jahr habe ich ihr nur Rosen geschenkt.", "sr": "B: Prošle godine sam joj poklonio samo ruže."}, {"de": "A: Früher konnte ich Blumen nicht gut auswählen.", "sr": "A: Ranije nisam umeo dobro da biram cveće."}, {"de": "B: Ich musste immer meine Schwester fragen.", "sr": "B: Uvek sam morao da pitam sestru."}, {"de": "A: Wissen Sie, ob Ihre Mutter gelbe Blumen mag?", "sr": "A: Znate li da li vaša majka voli žuto cveće?"}, {"de": "B: Nicht besonders, trotzdem mag sie Sonnenblumen.", "sr": "B: Ne naročito, ipak voli suncokrete."}, {"de": "A: Dann nehme ich Sonnenblumen, deshalb wird der Strauß heller.", "sr": "A: Onda uzimam suncokrete, zato će buket biti svetliji."}, {"de": "B: Ich habe auch eine kleine Karte vorbereitet.", "sr": "B: Pripremio sam i malu čestitku."}, {"de": "A: Ich wollte ungefähr zwanzig Euro ausgeben.", "sr": "A: Želeo sam da potrošim oko dvadeset evra."}, {"de": "B: Ich denke, dass wir dafür einen schönen Strauß machen können.", "sr": "B: Mislim da za taj novac možemo napraviti lep buket."}]}, {"title": "13. Diktat – Im Schuhgeschäft", "lines": [{"de": "A: Guten Tag, ich suche bequeme Schuhe.", "sr": "A: Dobar dan, tražim udobne cipele."}, {"de": "B: Welche Größe tragen Sie?", "sr": "B: Koji broj nosite?"}, {"de": "A: Ich brauche Größe 44, weil meine alten Schuhe zu klein sind.", "sr": "A: Treba mi broj 44 jer su mi stare cipele premale."}, {"de": "B: Ich glaube, dass dieses Modell sehr bequem ist.", "sr": "B: Mislim da je ovaj model veoma udoban."}, {"de": "A: Wenn es meine Größe gibt, probiere ich es gern an.", "sr": "A: Ako ima moj broj, rado ću ga probati."}, {"de": "B: Ich habe gerade ein Paar aus dem Lager geholt.", "sr": "B: Upravo sam donela jedan par iz magacina."}, {"de": "A: Früher konnte ich fast jedes Modell tragen.", "sr": "A: Ranije sam mogao da nosim skoro svaki model."}, {"de": "B: Nach der Verletzung musste ich weichere Schuhe kaufen.", "sr": "B: Posle povrede sam morao da kupujem mekše cipele."}, {"de": "A: Wissen Sie, ob diese Schuhe wasserdicht sind?", "sr": "A: Znate li da li su ove cipele vodootporne?"}, {"de": "B: Sie sind etwas schwer, trotzdem sind sie sehr stabil.", "sr": "B: Malo su teške, ipak su veoma stabilne."}, {"de": "A: Ich gehe viel zu Fuß, deshalb brauche ich gute Sohlen.", "sr": "A: Mnogo pešačim, zato mi trebaju dobri đonovi."}, {"de": "B: Viele Kunden haben dieses Modell gekauft.", "sr": "B: Mnogi kupci su kupili ovaj model."}, {"de": "A: Eigentlich wollte ich schwarze Schuhe.", "sr": "A: Zapravo sam želeo crne cipele."}, {"de": "B: Ich sehe, dass Ihnen die braunen auch gut gefallen.", "sr": "B: Vidim da vam se i braon cipele veoma sviđaju."}]}, {"title": "14. Diktat – Beim Zahnarzt", "lines": [{"de": "A: Guten Tag, ich habe seit gestern Zahnschmerzen.", "sr": "A: Dobar dan, od juče imam zubobolju."}, {"de": "B: Können Sie mir zeigen, welcher Zahn weh tut?", "sr": "B: Možete li mi pokazati koji zub vas boli?"}, {"de": "A: Ich glaube, dass es der Zahn links unten ist.", "sr": "A: Mislim da je to zub dole levo."}, {"de": "B: Der Zahn tut weh, weil dort ein Loch ist.", "sr": "B: Zub boli jer tamo postoji kvar."}, {"de": "A: Wenn Sie möchten, behandeln wir ihn heute.", "sr": "A: Ako želite, možemo ga danas lečiti."}, {"de": "B: Ich habe heute Morgen schon eine Tablette genommen.", "sr": "B: Jutros sam već popio tabletu."}, {"de": "A: Konnten Sie in der Nacht schlafen?", "sr": "A: Da li ste noću mogli da spavate?"}, {"de": "B: Nein, ich musste mehrmals aufstehen.", "sr": "B: Ne, morao sam više puta da ustajem."}, {"de": "A: Wissen Sie, ob Sie eine Betäubung vertragen?", "sr": "A: Znate li da li podnosite anesteziju?"}, {"de": "B: Ich habe ein bisschen Angst, trotzdem möchte ich die Behandlung.", "sr": "B: Malo se plašim, ipak želim tretman."}, {"de": "A: Der Zahn ist entzündet, deshalb müssen wir vorsichtig sein.", "sr": "A: Zub je upaljen, zato moramo biti oprezni."}, {"de": "B: Ich habe den Termin extra früh gemacht.", "sr": "B: Namerno sam zakazao rani termin."}, {"de": "A: Früher wollte ich nie zum Zahnarzt gehen.", "sr": "A: Ranije nikada nisam želeo da idem kod zubara."}, {"de": "B: Jetzt weiß ich, dass regelmäßige Kontrolle wichtig ist.", "sr": "B: Sada znam da je redovna kontrola važna."}]}, {"title": "15. Diktat – In der Natur", "lines": [{"de": "A: Heute ist das Wetter perfekt für einen Ausflug.", "sr": "A: Danas je vreme savršeno za izlet."}, {"de": "B: Ja, ich bin froh, dass die Sonne scheint.", "sr": "B: Da, drago mi je što sunce sija."}, {"de": "A: Wir fahren in den Wald, weil es dort ruhig ist.", "sr": "A: Idemo u šumu jer je tamo mirno."}, {"de": "B: Wenn wir Glück haben, sehen wir vielleicht Rehe.", "sr": "B: Ako budemo imali sreće, možda ćemo videti srne."}, {"de": "A: Letzte Woche habe ich dort viele Fotos gemacht.", "sr": "A: Prošle nedelje sam tamo napravio mnogo fotografija."}, {"de": "B: Ich habe auch einen kleinen See entdeckt.", "sr": "B: Otkrila sam i malo jezero."}, {"de": "A: Früher konnte ich stundenlang wandern.", "sr": "A: Ranije sam mogao satima da pešačim."}, {"de": "B: Letztes Jahr musste ich wegen meines Knies pausieren.", "sr": "B: Prošle godine sam morala da pauziram zbog kolena."}, {"de": "A: Weißt du, ob man hier Feuer machen darf?", "sr": "A: Znaš li da li je ovde dozvoljeno ložiti vatru?"}, {"de": "B: Es ist kühl, trotzdem machen wir lieber kein Feuer.", "sr": "B: Prohladno je, ipak je bolje da ne palimo vatru."}, {"de": "A: Der Weg ist lang, deshalb nehmen wir genug Wasser mit.", "sr": "A: Put je dug, zato nosimo dovoljno vode."}, {"de": "B: Ich habe auch Obst und Sandwiches eingepackt.", "sr": "B: Spakovala sam i voće i sendviče."}, {"de": "A: Ich wollte schon lange wieder in die Berge fahren.", "sr": "A: Već dugo sam želeo ponovo da idem u planine."}, {"de": "B: Ich glaube, dass dieser Tag sehr schön wird.", "sr": "B: Mislim da će ovaj dan biti veoma lep."}]}, {"title": "16. Diktat – Im Hotel", "lines": [{"de": "A: Guten Abend, wir haben ein Doppelzimmer reserviert.", "sr": "A: Dobro veče, rezervisali smo dvokrevetnu sobu."}, {"de": "B: Auf welchen Namen ist die Reservierung?", "sr": "B: Na koje ime glasi rezervacija?"}, {"de": "A: Ich glaube, dass sie auf den Namen Müller ist.", "sr": "A: Mislim da glasi na ime Müller."}, {"de": "B: Wir sind früh gekommen, weil unser Zug pünktlich war.", "sr": "B: Došli smo rano jer je naš voz bio tačan."}, {"de": "A: Wenn das Zimmer fertig ist, können Sie sofort einchecken.", "sr": "A: Ako je soba spremna, možete odmah da se prijavite."}, {"de": "B: Wir haben schon online bezahlt.", "sr": "B: Već smo platili onlajn."}, {"de": "A: Früher konnten Gäste nur an der Rezeption zahlen.", "sr": "A: Ranije su gosti mogli da plaćaju samo na recepciji."}, {"de": "B: Wir mussten damals immer Bargeld dabeihaben.", "sr": "B: Tada smo uvek morali da imamo gotovinu kod sebe."}, {"de": "A: Wissen Sie, ob das Frühstück im Preis ist?", "sr": "A: Znate li da li je doručak uračunat u cenu?"}, {"de": "B: Das Zimmer ist klein, trotzdem ist es sehr sauber.", "sr": "B: Soba je mala, ipak je veoma čista."}, {"de": "A: Wir bleiben drei Nächte, deshalb brauchen wir zwei Handtücher mehr.", "sr": "A: Ostajemo tri noći, zato su nam potrebna još dva peškira."}, {"de": "B: Der Mitarbeiter hat sie schon gebracht.", "sr": "B: Radnik ih je već doneo."}, {"de": "A: Ich wollte ein Zimmer mit Balkon.", "sr": "A: Želeo sam sobu sa balkonom."}, {"de": "B: Ich sehe, dass im dritten Stock noch eines frei ist.", "sr": "B: Vidim da na trećem spratu još ima jedna slobodna."}]}, {"title": "17. Diktat – An der Rezeption", "lines": [{"de": "A: Entschuldigung, ich habe eine Frage zu meinem Zimmer.", "sr": "A: Izvinite, imam pitanje u vezi sa svojom sobom."}, {"de": "B: Natürlich, wie kann ich Ihnen helfen?", "sr": "B: Naravno, kako mogu da vam pomognem?"}, {"de": "A: Ich denke, dass die Klimaanlage nicht funktioniert.", "sr": "A: Mislim da klima-uređaj ne radi."}, {"de": "B: Wir schicken einen Techniker, weil es heute sehr warm ist.", "sr": "B: Poslaćemo tehničara jer je danas veoma toplo."}, {"de": "A: Wenn es lange dauert, hätte ich gern ein anderes Zimmer.", "sr": "A: Ako bude dugo trajalo, želeo bih drugu sobu."}, {"de": "B: Ich habe schon nach freien Zimmern geschaut.", "sr": "B: Već sam pogledala slobodne sobe."}, {"de": "A: Gestern konnte ich die Türkarte nicht benutzen.", "sr": "A: Juče nisam mogao da koristim karticu za vrata."}, {"de": "B: Sie mussten deshalb zur Rezeption zurückkommen.", "sr": "B: Zato ste morali da se vratite na recepciju."}, {"de": "A: Wissen Sie, ob heute noch ein ruhiges Zimmer frei ist?", "sr": "A: Znate li da li je danas još slobodna neka mirna soba?"}, {"de": "B: Wir sind fast voll, trotzdem finde ich wahrscheinlich etwas.", "sr": "B: Skoro smo puni, ipak ću verovatno nešto pronaći."}, {"de": "A: Ich habe morgen früh einen Termin, deshalb brauche ich Ruhe.", "sr": "A: Sutra rano imam obavezu, zato mi je potreban mir."}, {"de": "B: Wir haben ein Zimmer im vierten Stock gefunden.", "sr": "B: Pronašli smo sobu na četvrtom spratu."}, {"de": "A: Eigentlich wollte ich nicht umziehen.", "sr": "A: Zapravo nisam želeo da se selim u drugu sobu."}, {"de": "B: Ich hoffe, dass Sie dort besser schlafen können.", "sr": "B: Nadam se da ćete tamo moći bolje da spavate."}]}, {"title": "18. Diktat – Im Park", "lines": [{"de": "A: Der Park ist heute sehr voll.", "sr": "A: Park je danas veoma pun."}, {"de": "B: Ja, viele Leute sind hier, weil das Wetter schön ist.", "sr": "B: Da, mnogo ljudi je ovde jer je vreme lepo."}, {"de": "A: Ich finde, dass die neuen Bänke gut aussehen.", "sr": "A: Mislim da nove klupe lepo izgledaju."}, {"de": "B: Wenn wir einen freien Platz finden, setzen wir uns hin.", "sr": "B: Ako nađemo slobodno mesto, sešćemo."}, {"de": "A: Ich habe gestern hier mit den Kindern gespielt.", "sr": "A: Juče sam se ovde igrao sa decom."}, {"de": "B: Wir haben am Wochenende die Enten gefüttert.", "sr": "B: Za vikend smo hranili patke."}, {"de": "A: Früher konnte man hier mit dem Fahrrad überall fahren.", "sr": "A: Ranije se ovde biciklom moglo voziti svuda."}, {"de": "B: Heute musste ich einen anderen Weg nehmen.", "sr": "B: Danas sam morala da idem drugim putem."}, {"de": "A: Weißt du, ob Hunde hier frei laufen dürfen?", "sr": "A: Znaš li da li psi ovde smeju slobodno da trče?"}, {"de": "B: Mein Hund ist ruhig, trotzdem halte ich ihn an der Leine.", "sr": "B: Moj pas je miran, ipak ga držim na povocu."}, {"de": "A: Es wird dunkel, deshalb gehen wir bald nach Hause.", "sr": "A: Smrkava se, zato ćemo uskoro kući."}, {"de": "B: Ich habe noch ein paar schöne Fotos gemacht.", "sr": "B: Napravila sam još nekoliko lepih fotografija."}, {"de": "A: Ich wollte heute eigentlich länger bleiben.", "sr": "A: Zapravo sam danas želeo da ostanem duže."}, {"de": "B: Ich glaube, dass wir morgen wiederkommen können.", "sr": "B: Mislim da sutra možemo ponovo da dođemo."}]}, {"title": "19. Diktat – An der Kasse", "lines": [{"de": "A: Guten Tag, haben Sie eine Kundenkarte?", "sr": "A: Dobar dan, imate li karticu kupca?"}, {"de": "B: Ja, ich glaube, dass sie in meiner Tasche ist.", "sr": "B: Da, mislim da je u mojoj torbi."}, {"de": "A: Ich frage, weil Sie damit Punkte sammeln können.", "sr": "A: Pitam jer sa njom možete da skupljate bodove."}, {"de": "B: Wenn ich sie finde, gebe ich sie Ihnen sofort.", "sr": "B: Ako je pronađem, odmah ću vam je dati."}, {"de": "A: Sie haben heute viele Sachen gekauft.", "sr": "A: Danas ste kupili mnogo stvari."}, {"de": "B: Ja, ich habe für die ganze Woche eingekauft.", "sr": "B: Da, kupio sam namirnice za celu nedelju."}, {"de": "A: Früher konnte man hier nur bar zahlen.", "sr": "A: Ranije se ovde moglo plaćati samo gotovinom."}, {"de": "B: Ich musste dann immer zum Geldautomaten gehen.", "sr": "B: Tada sam uvek morao da idem do bankomata."}, {"de": "A: Wissen Sie, ob Sie eine Quittung brauchen?", "sr": "A: Znate li da li vam je potreban račun?"}, {"de": "B: Die Schlange ist lang, trotzdem sind alle ruhig.", "sr": "B: Red je dug, ipak su svi mirni."}, {"de": "A: Ich habe es eilig, deshalb zahle ich kontaktlos.", "sr": "A: Žurim, zato plaćam beskontaktno."}, {"de": "B: Die Zahlung hat sofort funktioniert.", "sr": "B: Plaćanje je odmah uspelo."}, {"de": "A: Eigentlich wollte ich weniger kaufen.", "sr": "A: Zapravo sam želeo da kupim manje."}, {"de": "B: Jetzt sehe ich, dass mein Wagen doch sehr voll war.", "sr": "B: Sada vidim da su moja kolica ipak bila veoma puna."}]}, {"title": "20. Diktat – Im Restaurant", "lines": [{"de": "A: Guten Abend, haben Sie einen Tisch reserviert?", "sr": "A: Dobro veče, da li ste rezervisali sto?"}, {"de": "B: Ja, ich glaube, dass die Reservierung auf den Namen Petrović ist.", "sr": "B: Da, mislim da rezervacija glasi na ime Petrović."}, {"de": "A: Wir sitzen gern am Fenster, weil es dort ruhiger ist.", "sr": "A: Volimo da sedimo kraj prozora jer je tamo mirnije."}, {"de": "B: Wenn der Tisch frei ist, begleite ich Sie dorthin.", "sr": "B: Ako je sto slobodan, odvešću vas tamo."}, {"de": "A: Wir haben schon die Speisekarte gelesen.", "sr": "A: Već smo pročitali jelovnik."}, {"de": "B: Ich habe mich für die Suppe und das Hähnchen entschieden.", "sr": "B: Odlučio sam se za supu i piletinu."}, {"de": "A: Früher konnte ich sehr scharfes Essen essen.", "sr": "A: Ranije sam mogao da jedem veoma ljutu hranu."}, {"de": "B: Heute musste ich etwas Leichteres wählen.", "sr": "B: Danas sam morao da izaberem nešto lakše."}, {"de": "A: Wissen Sie, ob das Gericht Nüsse enthält?", "sr": "A: Znate li da li jelo sadrži orašaste plodove?"}, {"de": "B: Das Restaurant ist voll, trotzdem kommt das Essen schnell.", "sr": "B: Restoran je pun, ipak hrana stiže brzo."}, {"de": "A: Wir feiern Geburtstag, deshalb bestellen wir auch ein Dessert.", "sr": "A: Slavimo rođendan, zato naručujemo i desert."}, {"de": "B: Der Kellner hat uns einen Kuchen empfohlen.", "sr": "B: Konobar nam je preporučio kolač."}, {"de": "A: Ich wollte zuerst nur einen Kaffee trinken.", "sr": "A: U početku sam želeo da popijem samo kafu."}, {"de": "B: Jetzt finde ich, dass das Abendessen eine gute Idee war.", "sr": "B: Sada mislim da je večera bila dobra ideja."}]}];
let idx=0, showTranslation=true;
const sel=document.getElementById('topicSelect'), card=document.getElementById('card'), fill=document.getElementById('progressFill');
data.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.title;sel.appendChild(o);});
function speak(text){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/^A: |^B: /,''));u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}
function render(){const d=data[idx];sel.value=idx;fill.style.width=((idx+1)/data.length*100)+'%';card.innerHTML=`<div class="title">${d.title}</div><div class="meta">A2 · 14 rečenica · dass / wenn / weil / ob / deshalb / trotzdem · Perfekt · Modalverben im Präteritum</div>`+d.lines.map((x,i)=>`<div class="line"><div class="num">${i+1}</div><div><div class="de">${x.de}</div><div class="sr ${showTranslation?'':'hidden'}">${x.sr}</div><button class="speaker" data-i="${i}">🔊 Rečenica</button></div></div>`).join('');card.querySelectorAll('.speaker').forEach(b=>b.onclick=()=>speak(d.lines[+b.dataset.i].de));window.scrollTo({top:0,behavior:'smooth'})}
function playAll(){speechSynthesis.cancel(); const d=data[idx]; let i=0; const next=()=>{if(i>=d.lines.length)return;const u=new SpeechSynthesisUtterance(d.lines[i].de.replace(/^A: |^B: /,''));u.lang='de-DE';u.rate=.78;u.onend=()=>{i++;setTimeout(next,350)};speechSynthesis.speak(u)};next()}
document.getElementById('toggleTr').onclick=()=>{showTranslation=!showTranslation;document.getElementById('toggleTr').textContent='Prevod: '+(showTranslation?'ON':'OFF');render()};
document.getElementById('playAll').onclick=playAll;document.getElementById('stopAll').onclick=()=>speechSynthesis.cancel();
document.getElementById('prev').onclick=()=>{idx=(idx-1+data.length)%data.length;render()};document.getElementById('next').onclick=()=>{idx=(idx+1)%data.length;render()};sel.onchange=()=>{idx=+sel.value;render()};
render();
</script>
</body></html>
