<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b56c7"><title>A1 • Lekcija 2 • Test</title><style>
:root{--blue:#0b56c7;--blue2:#0a3f97;--ink:#0f1f3d;--bg:#eef5ff;--ok:#0c9b65;--bad:#df3d4f;--muted:#66748f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#e9f3ff 0%,#f8fbff 55%,#edf5ff 100%);color:var(--ink)}
body{display:flex;justify-content:center}.app{width:min(100%,640px);min-height:100vh;padding:16px 14px 28px}
.header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border-radius:24px;padding:18px 18px 16px;box-shadow:0 14px 34px rgba(11,86,199,.22);position:sticky;top:8px;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;letter-spacing:.5px;font-size:18px}.badge{font-size:12px;font-weight:800;padding:7px 10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px}
h1{font-size:22px;margin:10px 0 2px}.sub{opacity:.88;font-size:13px}.progressRow{display:flex;align-items:center;gap:10px;margin-top:14px}.bar{height:9px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;flex:1}.bar>div{height:100%;background:#fff;width:0%;transition:.3s}.count{font-weight:800;font-size:12px;min-width:54px;text-align:right}
.card{margin-top:16px;background:#fff;border:1px solid #dce9fb;border-radius:24px;padding:20px;box-shadow:0 12px 32px rgba(28,65,115,.10)}
.kicker{font-size:12px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.8px}.q{font-size:20px;line-height:1.35;font-weight:850;margin:8px 0 16px}
.options{display:grid;gap:10px}.opt{width:100%;border:1.5px solid #cfe0f7;background:#f8fbff;border-radius:16px;padding:14px 15px;text-align:left;font-size:16px;font-weight:750;color:var(--ink);cursor:pointer;transition:.16s;touch-action:manipulation}.opt:hover{transform:translateY(-1px);border-color:#8cb9f3}.opt.correct{background:#e8fff5;border-color:#56c99b;color:#08724d}.opt.wrong{background:#fff0f2;border-color:#f094a0;color:#a72235}.opt.dim{opacity:.58}
.wordbank,.assembled{display:flex;flex-wrap:wrap;gap:9px;min-height:52px;padding:11px;border-radius:16px}.wordbank{background:#f3f8ff;border:1px dashed #9fc1ee}.assembled{background:#fff;border:2px solid #d9e7f8;margin-bottom:12px}.word{border:0;background:#e7f1ff;color:#0a4baa;font-weight:850;border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer}.assembled .word{background:#0b56c7;color:#fff}.placeholder{color:#8a99b3;font-size:14px;padding:5px}
.feedback{margin-top:14px;border-radius:14px;padding:12px 13px;font-weight:750;display:none}.translationLine{display:block;margin-top:7px;padding-top:7px;border-top:1px solid rgba(8,114,77,.18);font-weight:800;color:#075b40}.feedback.ok{display:block;background:#eafff6;color:#08724d;border:1px solid #a8e7ce}.feedback.bad{display:block;background:#fff1f3;color:#a72235;border:1px solid #f3b5be}
.actions{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer;flex:1}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2ff;color:#0a4baa}.btn:disabled{opacity:.45;cursor:not-allowed}
.footerStat{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px;font-weight:700}.pill{background:#edf5ff;color:#0a4baa;border-radius:999px;padding:7px 10px}
.result{text-align:center;padding:12px 2px}.scoreCircle{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:14px auto;background:conic-gradient(var(--blue) var(--pct),#e5eef9 0);position:relative}.scoreCircle:after{content:'';position:absolute;inset:11px;background:white;border-radius:50%}.scoreText{position:relative;z-index:1;font-size:28px;font-weight:950;color:var(--blue)}.result h2{font-size:25px;margin:10px 0 6px}.result p{color:var(--muted);margin:0 0 16px}
@media (max-width:420px){.app{padding:10px 10px 22px}.header{border-radius:20px;padding:15px}.card{border-radius:20px;padding:16px}.q{font-size:18px}.opt{font-size:15px;padding:13px}.word{font-size:15px}.brand .logo{font-size:16px}}
</style></head><body><main class="app"><section class="header"><div class="brand"><div class="logo">DE-MAX TUTIN</div><div class="badge">A1 TEST</div></div><h1>A1 • Lekcija 2 • Test</h1><div class="sub">Časovi 4–6 • 20 zadataka</div><div class="progressRow"><div class="bar"><div id="barFill"></div></div><div class="count" id="num">1 / 20</div></div></section><section class="card" id="mainCard"><div class="kicker" id="type"></div><div class="q" id="question"></div><div id="content"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev" type="button">← Nazad</button><button class="btn secondary" id="check" type="button">Proveri</button><button class="btn primary" id="next" type="button">Sledeće →</button></div></section><div class="footerStat" id="footerStat"><span class="pill" id="scoreNow">Tačno: 0</span><span>Dodirni odgovor • mobilno 9:16</span></div></main><script>
const questions = [{"type": "mcq", "q": "Koji odgovor odgovara pitanju „Wie geht’s?“", "options": ["Gut, danke.", "Ich heiße Adnan.", "Ich komme aus Serbien.", "Ich bin 30 Jahre alt."], "answer": "Gut, danke."}, {"type": "mcq", "q": "Koje pitanje je formalno?", "options": ["Wie geht es Ihnen?", "Wie geht es dir?", "Wie heißt du?", "Wo wohnst du?"], "answer": "Wie geht es Ihnen?"}, {"type": "mcq", "q": "Koje pitanje je neformalno?", "options": ["Wie geht es dir?", "Wie geht es Ihnen?", "Wie heißen Sie?", "Woher kommen Sie?"], "answer": "Wie geht es dir?"}, {"type": "mcq", "q": "Dopuni: Ich ___ aus Serbien.", "options": ["komme", "kommst", "kommt", "kommen"], "answer": "komme"}, {"type": "mcq", "q": "Dopuni: Du ___ in Tutin.", "options": ["wohnst", "wohne", "wohnt", "wohnen"], "answer": "wohnst"}, {"type": "mcq", "q": "Dopuni: Wir ___ in Deutschland.", "options": ["leben", "lebt", "lebst", "lebe"], "answer": "leben"}, {"type": "mcq", "q": "Dopuni: Sie ___ Deutsch.", "options": ["studieren", "studiert", "studiere", "studierst"], "answer": "studieren"}, {"type": "mcq", "q": "Dopuni: Du ___ Amira.", "options": ["heißt", "heiße", "heißen", "heißtst"], "answer": "heißt"}, {"type": "mcq", "q": "Koji broj je „vierzehn“?", "options": ["14", "40", "4", "24"], "answer": "14"}, {"type": "mcq", "q": "Kako se kaže broj 20?", "options": ["zwanzig", "zwölf", "zwei", "dreißig"], "answer": "zwanzig"}, {"type": "mcq", "q": "Dopuni: Das ist ___ Vater.", "options": ["mein", "meine", "meinen", "meiner"], "answer": "mein"}, {"type": "mcq", "q": "Dopuni: Das ist ___ Mutter.", "options": ["meine", "mein", "meiner", "meinen"], "answer": "meine"}, {"type": "mcq", "q": "Dopuni: Das ist ___ Kind.", "options": ["mein", "meine", "meinen", "meiner"], "answer": "mein"}, {"type": "mcq", "q": "Dopuni: Das sind ___ Kinder.", "options": ["meine", "mein", "meiner", "meinen"], "answer": "meine"}, {"type": "order", "q": "Sastavi pravilnu potvrdnu rečenicu.", "words": ["spiele", "Ich", "Fußball", "heute", "."], "answer": ["Ich", "spiele", "heute", "Fußball", "."], "translation": "Danas igram fudbal."}, {"type": "order", "q": "Sastavi W-pitanje.", "words": ["du", "Wann", "Fußball", "spielst", "heute", "?"], "answer": ["Wann", "spielst", "du", "heute", "Fußball", "?"], "translation": "Kada danas igraš fudbal?"}, {"type": "mcq", "q": "Dopuni: Ich ___ müde.", "options": ["bin", "bist", "ist", "sind"], "answer": "bin"}, {"type": "mcq", "q": "Dopuni: Du ___ Zeit.", "options": ["hast", "habe", "hat", "haben"], "answer": "hast"}, {"type": "mcq", "q": "Präteritum od „sein“ za „ich“ glasi:", "options": ["war", "warst", "waren", "wart"], "answer": "war"}, {"type": "mcq", "q": "Kako se kaže broj 42?", "options": ["zweiundvierzig", "vierundzwei", "vierzigzwei", "zwanzigvier"], "answer": "zweiundvierzig"}];
let idx=0, score=0;
const answered = Array(questions.length).fill(false);
const results = Array(questions.length).fill(null);
let assembled=[];
const el = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){
  const q=questions[idx]; assembled=[];
  el('num').textContent=`${idx+1} / ${questions.length}`;
  el('barFill').style.width=`${((idx)/questions.length)*100}%`;
  el('scoreNow').textContent=`Tačno: ${score}`;
  el('type').textContent=q.type==='order'?'Sastavi rečenicu':'Odaberi odgovor';
  el('question').innerHTML=esc(q.q);
  el('content').innerHTML=''; el('feedback').className='feedback'; el('feedback').textContent='';
  el('check').style.display=q.type==='order'?'block':'none';
  el('next').disabled=!answered[idx];
  if(q.type==='mcq') renderMCQ(q); else renderOrder(q);
}
function renderMCQ(q){
  const wrap=document.createElement('div'); wrap.className='options';
  q.options.forEach(o=>{const b=document.createElement('button'); b.className='opt'; b.textContent=o; b.onclick=()=>chooseMCQ(b,o,q); wrap.appendChild(b);});
  el('content').appendChild(wrap);
  if(answered[idx]) restoreMCQ(q,wrap);
}
function chooseMCQ(btn,val,q){
  if(answered[idx]) return;
  answered[idx]=true; results[idx]=(val===q.answer); if(results[idx]) score++;
  [...btn.parentElement.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct'); else if(b===btn)b.classList.add('wrong'); else b.classList.add('dim');});
  showFeedback(results[idx], q.answer); el('next').disabled=false; el('scoreNow').textContent=`Tačno: ${score}`;
}
function restoreMCQ(q,wrap){
  [...wrap.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct'); else b.classList.add('dim');});
  showFeedback(results[idx], q.answer);
}
function renderOrder(q){
  const a=document.createElement('div');a.className='assembled';a.id='assembled';
  const bank=document.createElement('div');bank.className='wordbank';bank.id='bank';
  el('content').appendChild(a);el('content').appendChild(bank);
  if(answered[idx]){ assembled=[...q.answer]; drawOrder(q,true); showFeedback(results[idx],q.answer.join(' '),results[idx]?q.translation:null); el('check').disabled=true; el('next').disabled=false; }
  else { drawOrder(q,false); el('check').disabled=false; }
}
function drawOrder(q,locked=false){
  const a=el('assembled'), bank=el('bank'); a.innerHTML=''; bank.innerHTML='';
  if(!assembled.length){const p=document.createElement('span');p.className='placeholder';p.textContent='Dodirni reči redom…';a.appendChild(p);} 
  assembled.forEach((w,i)=>{const b=document.createElement('button');b.className='word';b.textContent=w;if(!locked)b.onclick=()=>{assembled.splice(i,1);drawOrder(q,false)};a.appendChild(b);});
  if(!locked){
    const used={}; assembled.forEach(w=>used[w]=(used[w]||0)+1);
    q.words.forEach(w=>{ const total=q.words.filter(x=>x===w).length, u=used[w]||0; if(u<total){used[w]=u+1; const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{assembled.push(w);drawOrder(q,false)};bank.appendChild(b);} });
  }
}
function checkOrder(){
  if(answered[idx]) return; const q=questions[idx]; const ok=assembled.join('\u0001')===q.answer.join('\u0001');
  answered[idx]=true; results[idx]=ok; if(ok)score++; showFeedback(ok,q.answer.join(' '),ok?q.translation:null);
  if(!ok){assembled=[...q.answer]; drawOrder(q,true);} else drawOrder(q,true);
  el('check').disabled=true; el('next').disabled=false; el('scoreNow').textContent=`Tačno: ${score}`;
}
function showFeedback(ok,ans,translation=null){
  const f=el('feedback');
  f.className='feedback '+(ok?'ok':'bad');
  if(ok){
    f.innerHTML='✓ Tačno!'+(translation?'<span class="translationLine">Prevod: '+esc(translation)+'</span>':'');
  }else{
    f.textContent='✗ Tačan odgovor: '+ans;
  }
}
function next(){ if(idx<questions.length-1){idx++;render();} else finish(); }
function prev(){ if(idx>0){idx--;render();} }
function finish(){
  const pct=Math.round(score/questions.length*100); el('barFill').style.width='100%';
  el('mainCard').innerHTML=`<div class="result"><div class="kicker">Rezultat</div><div class="scoreCircle" style="--pct:${pct}%"><div class="scoreText">${pct}%</div></div><h2>${score} / ${questions.length} tačno</h2><p>${pct>=90?'Odlično!':pct>=70?'Vrlo dobro!':pct>=50?'Dobro — ponovi još malo gradivo.':'Ponovi gradivo i pokušaj ponovo.'}</p><button class="btn primary" onclick="restart()">Uradi test ponovo</button></div>`;
  el('footerStat').style.display='none';
}
function restart(){location.reload();}
el('check').onclick=checkOrder; el('next').onclick=next; el('prev').onclick=prev; render();
</script></body></html>
