<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>DE-MAX A1 • Konjunktion denn</title>
<style>
:root{
  --navy:#071f59;
  --navy2:#0b3f9a;
  --red:#e31b23;
  --green:#168447;
  --bg:#eef5fc;
  --line:#d6e3f1;
  --text:#10223f;
  --muted:#6d7b8f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%,#60c0f6 0,transparent 25%),
    radial-gradient(circle at 85% 0%,#fff0a6 0,transparent 20%),
    linear-gradient(180deg,#061b4d 0 180px,#eef5fc 180px);
}
.app{
  width:min(100%,780px);
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  box-shadow:0 0 34px rgba(0,0,0,.18);
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#061a4c,#0d4299);
  color:#fff;padding:17px 15px 13px;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000}
.logo{
  width:48px;height:48px;border-radius:14px;background:#fff;color:var(--red);
  display:grid;place-items:center;font-style:italic;font-weight:1000;box-shadow:0 4px 12px rgba(0,0,0,.22)
}
.reset{
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  color:#fff;border-radius:11px;padding:9px 11px;font-weight:900;cursor:pointer
}
h1{font-size:clamp(28px,6.5vw,44px);margin:12px 0 2px;line-height:1}
.sub{font-weight:800;opacity:.9}
.progress-shell{height:10px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-top:12px}
.progress{height:100%;width:0;background:linear-gradient(90deg,#ffc51c,#fff);transition:.3s}
.stats{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:900}

main{padding:13px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:13px;
  box-shadow:0 7px 20px rgba(15,46,90,.08)
}
.rule{
  border-left:5px solid var(--red);
  background:linear-gradient(180deg,#f9fbff,#f2f7fd);
  border-radius:14px;padding:12px 13px;line-height:1.48;font-weight:700
}
.rule b{color:var(--red)}
.formula{
  margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;
  font-weight:1000;color:var(--navy)
}
.formula .denn{color:var(--red)}
.title{
  display:flex;align-items:center;gap:10px;font-size:20px;font-weight:1000;margin-bottom:10px
}
.num{
  width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#0a327e,#1765cf);
  color:#fff;display:grid;place-items:center;font-weight:1000
}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:900;margin-bottom:4px}
.sentences{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0
}
.sbox{
  background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:12px;
  font-size:17px;font-weight:1000;line-height:1.35
}
.sbox .verb{color:var(--green)}
.arrow{
  text-align:center;font-size:24px;color:var(--navy);font-weight:1000;margin:4px 0
}
.build{
  min-height:72px;border:2px dashed #b8cadf;border-radius:15px;background:#f8fbff;
  display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-content:flex-start
}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.word{
  border:1px solid #c8d8e9;background:#fff;color:#122441;border-radius:12px;padding:10px 12px;
  font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 2px 7px rgba(15,46,90,.05)
}
.word.denn{color:var(--red);border-color:#f0aaaa;background:#fff7f7}
.feedback{min-height:28px;margin-top:10px;font-weight:1000}
.good{color:#118247}.bad{color:#c52929}
.solution{
  display:none;margin-top:7px;padding:10px 11px;background:#effaf3;border:1px solid #bfe3cb;
  color:#17683b;border-radius:12px;font-weight:900;line-height:1.4
}
.translation{
  display:none;margin-top:7px;padding:10px 11px;background:#f5f8fc;border:1px solid var(--line);
  color:#65748a;border-radius:12px;font-style:italic
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{
  border:0;border-radius:14px;padding:12px;font-weight:1000;font-size:15px;cursor:pointer
}
.primary{background:linear-gradient(135deg,#e31b23,#b80c12);color:#fff}
.secondary{background:#748196;color:#fff}
.next{
  width:100%;margin-top:8px;background:linear-gradient(135deg,#071f59,#1763c9);color:#fff
}
.footer{text-align:center;color:#67778c;font-size:12px;padding:5px 14px 24px}
@media(max-width:560px){
  header{padding-top:max(14px,env(safe-area-inset-top))}
  main{padding:10px}
  .card{padding:13px;border-radius:17px}
  .sentences{grid-template-columns:1fr}
  .sbox{font-size:16px}
  h1{font-size:29px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand"><div class="logo">DM</div><div>DE-MAX <span style="opacity:.72">TUTIN</span></div></div>
    <button class="reset" onclick="resetAll()">↻ Reset</button>
  </div>
  <h1>Konjunktion: denn</h1>
  <div class="sub">Veznik „jer“ • složi rečenicu</div>
  <div class="progress-shell"><div id="progress" class="progress"></div></div>
  <div class="stats"><span id="score">Tačno: 0 / 12</span><span id="percent">0%</span></div>
</header>

<main>
  <section class="card">
    <div class="rule">
      Veznik <b>denn</b> spaja dve glavne rečenice. Posle <b>denn</b> red reči ostaje kao u glavnoj rečenici:
      <div class="formula">Hauptsatz 1, <span class="denn">denn</span> Hauptsatz 2.</div>
      Glagol i u drugoj rečenici ostaje na <b>2. mestu</b>.
    </div>
  </section>

  <section class="card" id="exercise"></section>
</main>
<div class="footer">DE-MAX • A1 nemački jezik • Konjunktion denn</div>
</div>

<script>
const items = [
  {
    a:"Ich gehe nicht zur Arbeit.",
    b:"Ich bin krank.",
    answer:"Ich gehe nicht zur Arbeit, denn ich bin krank.",
    sr:"Ne idem na posao, jer sam bolestan."
  },
  {
    a:"Ich esse kein Fleisch.",
    b:"Ich bin Vegetarier.",
    answer:"Ich esse kein Fleisch, denn ich bin Vegetarier.",
    sr:"Ne jedem meso, jer sam vegetarijanac."
  },
  {
    a:"Ich esse oft Äpfel.",
    b:"Sie sind gesund.",
    answer:"Ich esse oft Äpfel, denn sie sind gesund.",
    sr:"Često jedem jabuke, jer su zdrave."
  },
  {
    a:"Ich bleibe zu Hause.",
    b:"Es regnet.",
    answer:"Ich bleibe zu Hause, denn es regnet.",
    sr:"Ostajem kod kuće, jer pada kiša."
  },
  {
    a:"Ich lerne Deutsch.",
    b:"Ich möchte in Deutschland arbeiten.",
    answer:"Ich lerne Deutsch, denn ich möchte in Deutschland arbeiten.",
    sr:"Učim nemački, jer želim da radim u Nemačkoj."
  },
  {
    a:"Wir fahren mit dem Bus.",
    b:"Das Auto ist kaputt.",
    answer:"Wir fahren mit dem Bus, denn das Auto ist kaputt.",
    sr:"Idemo autobusom, jer je auto pokvaren."
  },
  {
    a:"Sie trinkt viel Wasser.",
    b:"Sie hat Durst.",
    answer:"Sie trinkt viel Wasser, denn sie hat Durst.",
    sr:"Ona pije mnogo vode, jer je žedna."
  },
  {
    a:"Er geht früh ins Bett.",
    b:"Er ist müde.",
    answer:"Er geht früh ins Bett, denn er ist müde.",
    sr:"On ide rano u krevet, jer je umoran."
  },
  {
    a:"Ich kaufe Brot.",
    b:"Wir haben kein Brot zu Hause.",
    answer:"Ich kaufe Brot, denn wir haben kein Brot zu Hause.",
    sr:"Kupujem hleb, jer nemamo hleba kod kuće."
  },
  {
    a:"Anna nimmt einen Regenschirm.",
    b:"Es regnet draußen.",
    answer:"Anna nimmt einen Regenschirm, denn es regnet draußen.",
    sr:"Ana uzima kišobran, jer napolju pada kiša."
  },
  {
    a:"Paul macht das Fenster auf.",
    b:"Es ist warm im Zimmer.",
    answer:"Paul macht das Fenster auf, denn es ist warm im Zimmer.",
    sr:"Paul otvara prozor, jer je u sobi toplo."
  },
  {
    a:"Wir lernen heute viel.",
    b:"Morgen haben wir einen Test.",
    answer:"Wir lernen heute viel, denn morgen haben wir einen Test.",
    sr:"Danas mnogo učimo, jer sutra imamo test."
  }
];

let index=0;
let correct=Array(items.length).fill(false);
let chosen=[];
let remaining=[];

function tokenize(sentence){
  return sentence
    .replace(",", "")
    .split(/\s+/)
    .filter(Boolean);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalize(s){
  return s.toLowerCase().trim()
    .replace(/\s+/g," ")
    .replace(/\s+([,.!?])/g,"$1")
    .replace(/[.]+$/,"");
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="de-DE";u.rate=.88;
  const voices=speechSynthesis.getVoices();
  const de=voices.find(v=>(v.lang||"").toLowerCase().startsWith("de"));
  if(de)u.voice=de;
  speechSynthesis.speak(u);
}
function markVerb(sentence){
  const verbs=["gehe","bin","esse","sind","bleibe","regnet","lerne","möchte","fahren","ist","trinkt","hat","geht","kaufe","haben","nimmt","macht","lernen","haben"];
  let out=sentence;
  for(const v of verbs){
    out=out.replace(new RegExp("\\b"+v+"\\b"),`<span class="verb">${v}</span>`);
  }
  return out;
}

function setupWords(){
  const it=items[index];
  const raw = tokenize(it.answer);
  remaining = shuffle(raw);
  chosen = [];
}
function render(){
  const it=items[index];
  const box=document.getElementById("exercise");
  box.innerHTML=`
    <div class="title">
      <div class="num">${index+1}</div>
      <div>
        <div>Složi rečenicu sa „denn“</div>
        <div style="font-size:13px;color:#6d7b8f;font-weight:700">Spoji dve glavne rečenice.</div>
      </div>
    </div>

    <div class="label">Dve rečenice</div>
    <div class="sentences">
      <div class="sbox">${markVerb(it.a)}</div>
      <div class="sbox">${markVerb(it.b)}</div>
    </div>

    <div class="arrow">↓</div>
    <div class="label">Složi jednu rečenicu:</div>
    <div id="build" class="build"></div>
    <div id="bank" class="wordbank"></div>

    <div class="actions">
      <button class="btn primary" onclick="checkAnswer()">Proveri</button>
      <button class="btn secondary" onclick="resetWords()">Ponovo</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <div id="solution" class="solution"></div>
    <div id="translation" class="translation"></div>

    <button class="btn next" onclick="nextItem()">Sledeći primer →</button>
  `;
  draw();
  updateProgress();
}
function draw(){
  const build=document.getElementById("build");
  const bank=document.getElementById("bank");
  build.innerHTML="";
  bank.innerHTML="";

  chosen.forEach((w,i)=>{
    const b=document.createElement("button");
    b.className="word"+(w.toLowerCase().replace(/[,.!?]/g,"")==="denn"?" denn":"");
    b.textContent=w;
    b.onclick=()=>{
      remaining.push(w);
      chosen.splice(i,1);
      draw();
    };
    build.appendChild(b);
  });

  remaining.forEach((w,i)=>{
    const b=document.createElement("button");
    b.className="word"+(w.toLowerCase().replace(/[,.!?]/g,"")==="denn"?" denn":"");
    b.textContent=w;
    b.onclick=()=>{
      chosen.push(w);
      remaining.splice(i,1);
      draw();
    };
    bank.appendChild(b);
  });
}
function checkAnswer(){
  const it=items[index];
  let text=chosen.join(" ");
  text=text.replace(/\s+([,.!?])/g,"$1");

  const ok=normalize(text)===normalize(it.answer);
  correct[index]=ok;

  const fb=document.getElementById("feedback");
  const sol=document.getElementById("solution");
  const tr=document.getElementById("translation");

  if(ok){
    fb.innerHTML='<span class="good">✓ Tačno! Odlično složena rečenica.</span>';
    sol.style.display="none";
    tr.style.display="block";
    tr.textContent=it.sr;
    speak(it.answer);
  }else{
    fb.innerHTML='<span class="bad">✗ Nije tačno. Obrati pažnju: posle „denn“ ide glavna rečenica i glagol ostaje na 2. mestu.</span>';
    sol.style.display="block";
    sol.textContent="Tačno: "+it.answer;
    tr.style.display="block";
    tr.textContent=it.sr;
  }
  updateProgress();
}
function resetWords(){
  setupWords();
  render();
}
function nextItem(){
  index=(index+1)%items.length;
  setupWords();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function updateProgress(){
  const done=correct.filter(Boolean).length;
  const p=Math.round(done/items.length*100);
  document.getElementById("score").textContent=`Tačno: ${done} / ${items.length}`;
  document.getElementById("percent").textContent=p+"%";
  document.getElementById("progress").style.width=p+"%";
}
function resetAll(){
  index=0;
  correct=Array(items.length).fill(false);
  setupWords();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

setupWords();
render();
</script>
</body>
</html>
