  function sweep(from,to,d,vol=.045,kind='sawtooth',delay=0){
    const a=audio();if(!a)return;
    try{let t=a.currentTime+delay,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
      o.type=kind;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(to,t+d);
      f.type='lowpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(650,t+d);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)
    }catch(e){}
  }
  function play(type){
    if(!enabled)return;
    if(type==='tap'){sweep(680,420,.085,.017,'triangle')}
    else if(type==='correct'){
      sweep(310,690,.18,.052,'triangle');
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.27,i*.065,'triangle',.037));
    }
    else if(type==='wrong'){
      sweep(440,165,.29,.052,'sawtooth');tone(164.81,.22,.12,'triangle',.025)
    }
    else if(type==='win'){[523,659,784,1047,1318].forEach((f,i)=>tone(f,.35,i*.11,'triangle',.044))}
    else if(type==='spin'){sweep(280,1050,.22,.03,'triangle')}
  }
  window.DeMaxSound={play};
  const b=document.createElement("button");
  b.type="button";b.className="demax-sound-toggle";
  b.setAttribute("aria-label","Uključi ili isključi zvuk");
  b.title="Zvuk uključen / isključen";
  function label(){b.textContent=enabled?"🔊 Zvuk":"🔇 Zvuk";b.setAttribute("aria-pressed",String(enabled))}
  label();
  b.addEventListener("click",function(e){e.stopPropagation();enabled=!enabled;try{localStorage.setItem("demax_a1_sound",enabled?"on":"off")}catch(err){}label();if(enabled)play("tap")});
  const header=document.querySelector(".top, .header");
  if(header)header.appendChild(b);
  document.addEventListener("click",function(e){
    const btn=e.target.closest("button");
    if(!btn||btn===b||!enabled)return;
    const now=Date.now();if(now-lastTap<45)return;lastTap=now;
    if(btn.textContent.includes("Zavrti"))play("spin");else play("tap");
  },true);
})();

<script>
/* Original DE-MAX electronic game soundtrack — Web Audio, 124 BPM. */
(function(){
 'use strict';
 let enabled=true,playing=false,ctx=null,tickId=null,step=0,nextTime=0,noise=null;
 const active=new Set(),BPM=124,STEP=60/BPM/4;
 try{enabled=localStorage.getItem('demax_a1_music')!=='off'}catch(e){}
 const b=document.createElement('button');
 b.type='button';b.className='demax-music-toggle';
 b.setAttribute('aria-label','Uključi ili isključi pozadinsku muziku');
 function label(){b.textContent=enabled?'🎵 Muzika: ON':'🔇 Muzika: OFF';b.setAttribute('aria-pressed',String(enabled))}
 function audio(){
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}catch(e){return null}
 }
 function track(node){active.add(node);node.onended=()=>{active.delete(node);try{node.disconnect()}catch(e){}}}
 function env(t,d,peak){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(ctx.destination);return g}
 function synth(f,t,d,vol=.018,type='triangle'){
  let o=ctx.createOscillator(),g=env(t,d,vol);
  o.type=type;o.frequency.setValueAtTime(f,t);o.connect(g);o.start(t);o.stop(t+d+.015);track(o);
 }
 function kick(t){
  let o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(148,t);o.frequency.exponentialRampToValueAtTime(46,t+.19);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.007);g.gain.exponentialRampToValueAtTime(.0001,t+.27);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.29);track(o);
 }
 function noiseBuffer(){
  if(noise)return noise;noise=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.5),ctx.sampleRate);
  let data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;return noise
 }
 function noiseHit(t,d,vol,highpass){
  const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=noiseBuffer();filter.type='highpass';filter.frequency.value=highpass;
  g.gain.setValueAtTime(Math.max(.0001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(filter);filter.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+d+.015);track(src);
 }
 const roots=[110,87.31,130.81,98]; // A minor • F major • C major • G
 function playStep(t,n){
  const k=n%16,bar=Math.floor(n/16)%4,root=roots[bar];
  if(k===0||k===4||k===8||k===12)kick(t);
  if(k===4||k===12){noiseHit(t,.13,.055,1150);synth(180,t,.1,.015,'triangle')}
  if(k%2===0)noiseHit(t,k%4===2?.055:.035,k%4===2?.021:.014,6500);
  if(k===7||k===15)noiseHit(t,.024,.009,8700);
  if([0,3,6,8,11,14].includes(k)){
   const f=root*(k===6?1.5:k===14?2:1);
   synth(f,t,.18,.036,'sawtooth');synth(f/2,t,.18,.018,'sine');
  }
  if([2,5,10,13].includes(k)){
   const melody=[0,3,7,10,12,7,3,5],degrees=[1,1.1892,1.4983,1.7818];
   const f=roots[bar]*4*degrees[(k+bar)%4];
   synth(f,t,.135,.011,'triangle');
  }
  if(k===0){synth(root*2,t,.65,.008,'sine');synth(root*2*1.4983,t,.65,.006,'sine')}
 }
 function schedule(){
  if(!playing||!enabled||!ctx)return;
  let horizon=ctx.currentTime+.2,count=0;
  while(nextTime<horizon&&count++<12){playStep(nextTime,step++);nextTime+=STEP}
 }
 function stop(){
  playing=false;if(tickId!==null){clearInterval(tickId);tickId=null}
  const a=ctx;if(a){for(const n of active){try{n.stop(a.currentTime+.015)}catch(e){}}active.clear()}
 }
 function start(){
  if(playing||!enabled)return;const a=audio();if(!a)return;
  playing=true;step=0;nextTime=a.currentTime+.035;schedule();tickId=setInterval(schedule,75);
 }
 b.addEventListener('click',function(e){
  e.stopPropagation();enabled=!enabled;
  try{localStorage.setItem('demax_a1_music',enabled?'on':'off')}catch(e){}
  label();if(enabled&&document.documentElement.dataset.demaxGameStarted==='yes')start();else stop();
 });
 label();const header=document.querySelector('.top,.header');if(header)header.appendChild(b);
 window.DeMaxMusic={start:function(){document.documentElement.dataset.demaxGameStarted='yes';start()},stop:function(){document.documentElement.dataset.demaxGameStarted='no';stop()}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(document.documentElement.dataset.demaxGameStarted==='yes')start()});
 window.addEventListener('pagehide',stop);
})();
