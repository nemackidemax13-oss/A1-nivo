<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A2 testovi • Lekcije 1–7</title>
<style>
:root{--blue:#0b55d4;--blue2:#073b9e;--sky:#eaf4ff;--ink:#0c2142;--muted:#65758b;--ok:#15803d;--bad:#c62828;--card:#fff;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eaf4ff 0,#f8fbff 45%,#eef6ff 100%);color:var(--ink);min-height:100vh}
.app{width:min(100%,520px);margin:0 auto;min-height:100vh;padding:18px 16px 28px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-weight:1000;letter-spacing:-1px;color:#e21a1a;font-size:26px} .logo span{color:#0b55d4} .badge{font-weight:800;background:#fff;color:var(--blue);border:1px solid #dbeafe;padding:8px 12px;border-radius:999px;box-shadow:0 8px 24px #0b55d414}
.hero{background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;border-radius:28px;padding:22px;box-shadow:0 18px 45px #0b55d42b;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.05} .hero p{margin:0;opacity:.9;line-height:1.45}
.panel{background:#ffffffdd;border:1px solid #dcecff;backdrop-filter:blur(10px);border-radius:24px;padding:16px;box-shadow:0 12px 35px #153e7512}
.grid{display:grid;gap:12px}
.lesson{border:1px solid #dbeafe;background:#fff;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.18s ease;box-shadow:0 8px 20px #0b55d40d}
.lesson:hover{transform:translateY(-2px);border-color:#9ec5ff;box-shadow:0 14px 30px #0b55d419}
.num{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#3b82f6);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:0 0 auto}
.lesson h3{margin:0 0 4px;font-size:17px} .lesson p{margin:0;color:var(--muted);font-size:13px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px} .back{border:0;background:#fff;color:var(--blue);font-weight:900;border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:0 8px 20px #0b55d414}
.meta{flex:1} .meta b{display:block;font-size:14px} .meta span{font-size:12px;color:var(--muted)}
.progress{height:9px;background:#e5efff;border-radius:999px;overflow:hidden;margin:12px 0 18px} .bar{height:100%;background:linear-gradient(90deg,#2f80ed,#0b55d4);width:0;transition:.25s}
.qcard{background:#fff;border-radius:26px;padding:20px;box-shadow:0 14px 40px #0b55d414;border:1px solid #e1ecfb}
.counter{font-size:12px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.08em} .q{font-size:22px;font-weight:900;line-height:1.25;margin:10px 0 16px}
.opts{display:grid;gap:10px} button.opt{text-align:left;width:100%;border:1px solid #dbe7f7;background:#f9fbff;padding:14px 15px;border-radius:16px;font-size:16px;font-weight:750;color:var(--ink);cursor:pointer;transition:.15s}
button.opt:hover{border-color:#96bfff;background:#f2f7ff} button.opt.correct{background:#ecfdf3;border-color:#7bd99b;color:#116b31} button.opt.wrong{background:#fff1f1;border-color:#f0a1a1;color:#a51f1f}
.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:16px;background:#f4f8ff;border:1px solid #dbeafe;font-size:14px;line-height:1.45}
.actions{display:flex;gap:10px;margin-top:14px} .primary{flex:1;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-size:16px;font-weight:900;cursor:pointer} .primary:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center;padding:8px 4px 2px} .score{font-size:56px;font-weight:1000;color:var(--blue);letter-spacing:-3px;margin:10px 0 2px} .result h2{margin:6px 0} .result p{color:var(--muted);line-height:1.5}
.pill{display:inline-block;background:#edf5ff;color:var(--blue);font-weight:900;padding:8px 12px;border-radius:999px;font-size:12px}
.footer{text-align:center;color:#8a99ad;font-size:12px;margin-top:18px} .hidden{display:none!important}
@media (max-width:390px){.hero h1{font-size:26px}.q{font-size:20px}.app{padding:14px 12px 24px}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="logo">DE-<span>MAX</span></div><div class="badge">A2 • TESTOVI</div></div>
  <section id="home">
    <div class="hero"><h1>A2 testovi • Lekcije 1–7</h1><p>Sedam odvojenih interaktivnih testova, zasnovanih na materijalu iz prvih sedam De‑Max A2 časova. Moderan plavo‑beli dizajn, automatsko bodovanje i objašnjenje posle svakog odgovora.</p></div>
    <div class="panel">
      <div id="lessonGrid" class="grid"></div>
    </div>
    <div class="footer">De‑Max Deutsch • A2 • mobilni format</div>
  </section>
  <section id="quiz" class="hidden">
    <div class="top"><button class="back" id="backBtn">←</button><div class="meta"><b id="quizTitle"></b><span id="quizSub"></span></div><div class="pill" id="liveScore">0 bod.</div></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="qcard">
      <div class="counter" id="counter"></div>
      <div class="q" id="question"></div>
      <div class="opts" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions"><button class="primary" id="nextBtn" disabled>Sledeće pitanje</button></div>
    </div>
  </section>
  <section id="result" class="hidden">
    <div class="hero result">
      <div class="pill">REZULTAT</div>
      <div class="score" id="scorePct">0%</div>
      <h2 id="resultTitle">Završen test</h2>
      <p id="resultText"></p>
    </div>
    <div class="panel grid">
      <button class="primary" id="retryBtn">Ponovi test</button>
      <button class="back" id="homeBtn">Nazad na početak</button>
    </div>
  </section>
</div>
<script>
const MODE="multi";
const DATA=[{"title": "Test 1", "subtitle": "weil – razlozi i red reči", "questions": [{"q": "Ich bleibe zu Hause, ___ ich krank bin.", "o": ["weil", "deshalb", "trotzdem", "wenn"], "a": 0, "e": "Posle „weil“ glagol ide na kraj zavisne rečenice."}, {"q": "Sie lernt viel, weil sie morgen einen Test ___.", "o": ["hat", "haben", "hast", "habt"], "a": 0, "e": "Subjekat je „sie“, zato ide „hat“."}, {"q": "Koja rečenica je pravilna?", "o": ["Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.", "Ich lerne Deutsch, weil ich möchte in Deutschland arbeiten.", "Ich lerne Deutsch, weil möchte ich in Deutschland arbeiten.", "Ich lerne Deutsch, weil in Deutschland ich arbeiten möchte."], "a": 0, "e": "Kod „weil“ glagolski deo ide na kraj."}, {"q": "Ich esse jetzt, weil ich großen Hunger ___.", "o": ["habe", "bin", "hat", "sein"], "a": 0, "e": "Pravilno: „Hunger haben“."}, {"q": "Warum kaufst du ein Auto? – Weil ich es für die Arbeit ___.", "o": ["brauche", "braucht", "brauchst", "brauchen"], "a": 0, "e": "Uz „ich“ ide „brauche“."}, {"q": "Ich gehe heute nicht zum Sport, weil ich müde ___.", "o": ["bin", "bist", "ist", "habe"], "a": 0, "e": "Uz „ich“ ide „bin“."}, {"q": "Dopuni: Ich lerne viel, weil ich eine Prüfung ___.", "o": ["habe", "bin", "werde", "seid"], "a": 0, "e": "Pravilna konstrukcija je „eine Prüfung haben“."}, {"q": "Gde stoji lični glagol u zavisnoj rečenici sa „weil“?", "o": ["Na kraju", "Na prvom mestu", "Uvek na drugom mestu", "Ispred subjekta"], "a": 0, "e": "„weil“ šalje konjugovani glagol na kraj zavisne rečenice."}, {"q": "Koji odgovor najbolje odgovara na „Warum bleibst du zu Hause?“", "o": ["Weil ich keine Zeit habe.", "Trotzdem ich keine Zeit habe.", "Deshalb ich keine Zeit habe.", "Wenn ich keine Zeit habe."], "a": 0, "e": "Za direktno navođenje razloga koristimo „weil“."}, {"q": "Izaberi pravilan red reči.", "o": ["weil ich Deutsch lernen will", "weil ich will Deutsch lernen", "weil will ich Deutsch lernen", "weil Deutsch ich will lernen"], "a": 0, "e": "Kod modalnog glagola infinitiv i modalni glagol stoje na kraju, modalni poslednji."}]}, {"title": "Test 2", "subtitle": "Perfekt – haben / sein", "questions": [{"q": "Ich ___ gestern gearbeitet.", "o": ["habe", "bin", "hat", "ist"], "a": 0, "e": "„arbeiten“ gradi Perfekt sa „haben“."}, {"q": "Ich habe einen Roman ___.", "o": ["gelesen", "geleset", "lesen", "gelest"], "a": 0, "e": "Partizip II od „lesen“ je „gelesen“."}, {"q": "Wir haben Fußball ___.", "o": ["gespielt", "gespielen", "spielen", "gespieltet"], "a": 0, "e": "Partizip II: „gespielt“."}, {"q": "Ich habe den Film ___.", "o": ["gesehen", "geseht", "sehen", "gesieht"], "a": 0, "e": "Partizip II od „sehen“ je „gesehen“."}, {"q": "Ich ___ zu meinen Eltern gefahren.", "o": ["bin", "habe", "ist", "hat"], "a": 0, "e": "Kretanje sa promenom mesta najčešće gradi Perfekt sa „sein“."}, {"q": "Wir ___ nach Stockholm geflogen.", "o": ["sind", "haben", "seid", "hat"], "a": 0, "e": "„fliegen“ u ovom značenju gradi Perfekt sa „sein“."}, {"q": "Er ist zur Schule ___.", "o": ["gegangen", "gegeht", "gehen", "gegangen hat"], "a": 0, "e": "Partizip II od „gehen“ je „gegangen“."}, {"q": "Ich habe einen Brief ___.", "o": ["geschrieben", "geschreibt", "schreiben", "geschreibet"], "a": 0, "e": "Partizip II od „schreiben“ je „geschrieben“."}, {"q": "Koje pitanje je pravilno?", "o": ["Wann bist du gegangen?", "Wann hast du gegangen?", "Wann du bist gegangen?", "Wann gegangen bist du?"], "a": 0, "e": "„gehen“ u Perfektu koristi „sein“."}, {"q": "Wo ___ du gewesen?", "o": ["bist", "hast", "ist", "hat"], "a": 0, "e": "Perfekt od „sein“: „bist gewesen“."}]}, {"title": "Test 3", "subtitle": "Perfekt – odvojivi i neodvojivi glagoli", "questions": [{"q": "Er ist früh ___.", "o": ["aufgestanden", "geaufstanden", "aufstehen", "aufgestandet"], "a": 0, "e": "„aufstehen“ → „aufgestanden“."}, {"q": "Ich habe gestern ___.", "o": ["eingekauft", "geeingekauft", "einkaufen", "eingekaufen"], "a": 0, "e": "„einkaufen“ → „eingekauft“."}, {"q": "Du hast mich ___.", "o": ["angerufen", "geanrufen", "angeruft", "anrufen"], "a": 0, "e": "„anrufen“ → „angerufen“."}, {"q": "Er hat gestern Abend ___.", "o": ["ferngesehen", "geferngesehen", "fernsehen", "ferngeseht"], "a": 0, "e": "„fernsehen“ → „ferngesehen“."}, {"q": "Ich habe den Text ___.", "o": ["bekommen", "gebekommen", "bekommt", "bekommet"], "a": 0, "e": "Glagol sa prefiksom be- nema „ge-“."}, {"q": "Sie hat mir das Buch ___.", "o": ["empfohlen", "geempfohlen", "empfehlt", "empfehlen"], "a": 0, "e": "„empfehlen“ → „empfohlen“."}, {"q": "Wir haben eine neue Stadt ___.", "o": ["entdeckt", "geentdeckt", "entdecken", "entdecket"], "a": 0, "e": "Glagol sa ent- nema „ge-“."}, {"q": "Er hat eine Geschichte ___.", "o": ["erzählt", "geerzählt", "erzählen", "erzähltet"], "a": 0, "e": "Glagol sa er- nema „ge-“."}, {"q": "Es ist gestern etwas ___.", "o": ["passiert", "gepassiert", "passieren", "passiertet"], "a": 0, "e": "Glagoli na -ieren grade particip bez „ge-“."}, {"q": "Er hat mein Handy ___.", "o": ["repariert", "gerepariert", "reparieren", "repariertet"], "a": 0, "e": "„reparieren“ → „repariert“."}]}, {"title": "Test 4", "subtitle": "Dativ i lokacioni predlozi", "questions": [{"q": "Das Bild hängt ___ der Wand.", "o": ["an", "in", "unter", "hinter"], "a": 0, "e": "Za položaj na vertikalnoj površini koristimo „an“."}, {"q": "Das Buch liegt ___ dem Tisch.", "o": ["auf", "vor", "über", "in"], "a": 0, "e": "„auf dem Tisch“ = na stolu."}, {"q": "Die Katze sitzt ___ dem Tisch.", "o": ["unter", "über", "auf", "vor"], "a": 0, "e": "„unter dem Tisch“ = ispod stola."}, {"q": "Das Auto steht ___ dem Haus.", "o": ["vor", "über", "in", "auf"], "a": 0, "e": "„vor dem Haus“ = ispred kuće."}, {"q": "Die Lampe hängt ___ dem Tisch.", "o": ["über", "unter", "hinter", "in"], "a": 0, "e": "„über dem Tisch“ = iznad stola."}, {"q": "Dativ od „der Tisch“ je:", "o": ["dem Tisch", "den Tisch", "der Tisch", "des Tisch"], "a": 0, "e": "Muški i srednji rod u dativu dobijaju član „dem“."}, {"q": "Dativ od „die Wand“ je:", "o": ["der Wand", "die Wand", "den Wand", "dem Wand"], "a": 0, "e": "Ženski rod u dativu ima član „der“."}, {"q": "Dativ množine od „die Stühle“ je:", "o": ["den Stühlen", "die Stühle", "der Stühle", "dem Stühlen"], "a": 0, "e": "Množina u dativu: „den“ + često nastavak -n na imenici."}, {"q": "Koji izraz označava „iza kuće“?", "o": ["hinter dem Haus", "vor dem Haus", "über dem Haus", "auf dem Haus"], "a": 0, "e": "„hinter“ = iza."}, {"q": "Koji predlog odgovara značenju „u“ kod mirnog položaja?", "o": ["in", "auf", "vor", "über"], "a": 0, "e": "„in“ se koristi za položaj unutar prostora."}]}, {"title": "Test 5", "subtitle": "Alltag i obwohl", "questions": [{"q": "U tekstu iz lekcije, kada osoba ustaje?", "o": ["Um 7 Uhr", "Um 6 Uhr", "Um 8 Uhr", "Um 9 Uhr"], "a": 0, "e": "U tekstu stoji: „Am Morgen stehe ich um 7 Uhr auf…“"}, {"q": "Sa kim doručkuje?", "o": ["Mit der Familie", "Mit den Kollegen", "Allein", "Mit Freunden"], "a": 0, "e": "U tekstu: „…frühstücke mit meiner Familie.“"}, {"q": "Was macht die Person in der Pause?", "o": ["Sie trinkt Kaffee und spricht mit Kollegen.", "Sie schläft.", "Sie fährt nach Hause.", "Sie spielt Fußball."], "a": 0, "e": "To je direktno navedeno u tekstu."}, {"q": "Was macht die Person am Nachmittag?", "o": ["Sie kauft im Supermarkt ein.", "Sie geht ins Kino.", "Sie lernt in der Schule.", "Sie schwimmt."], "a": 0, "e": "U tekstu se navodi kupovina u supermarketu."}, {"q": "Was macht die Person am Wochenende?", "o": ["Sie trifft Freunde oder macht einen Spaziergang.", "Sie arbeitet immer.", "Sie reist nach Berlin.", "Sie bleibt nur zu Hause."], "a": 0, "e": "Tako piše u završnom delu teksta."}, {"q": "„obwohl“ najčešće znači:", "o": ["iako", "zato", "jer", "kada"], "a": 0, "e": "„obwohl“ uvodi dopusnu zavisnu rečenicu: iako."}, {"q": "Koja rečenica je pravilna?", "o": ["Ich gehe zur Arbeit, obwohl ich müde bin.", "Ich gehe zur Arbeit, obwohl bin ich müde.", "Obwohl ich bin müde, gehe ich zur Arbeit.", "Ich gehe obwohl zur Arbeit ich müde bin."], "a": 0, "e": "Kod „obwohl“ glagol ide na kraj zavisne rečenice."}, {"q": "„Danach gehe ich zur Arbeit.“ Reč „Danach“ znači:", "o": ["Posle toga", "Pre toga", "Zbog toga", "Uprkos tome"], "a": 0, "e": "„danach“ = posle toga."}, {"q": "„Dort koche ich das Abendessen.“ „Dort“ znači:", "o": ["tamo", "ovde", "juče", "sutra"], "a": 0, "e": "„dort“ = tamo."}, {"q": "Zašto osoba smatra svakodnevicu zanimljivom?", "o": ["Weil sie viele verschiedene Dinge macht.", "Weil sie nie arbeitet.", "Weil sie nur schläft.", "Weil sie jeden Tag reist."], "a": 0, "e": "Tekst se završava razlogom: „weil ich viele verschiedene Dinge mache“."}]}, {"title": "Test 6", "subtitle": "wenn – uslovne i vremenske rečenice", "questions": [{"q": "___ ich Zeit habe, gehe ich spazieren.", "o": ["Wenn", "Weil", "Trotzdem", "Deshalb"], "a": 0, "e": "„wenn“ = kada/ako."}, {"q": "Wenn du Hunger hast, ___ du Pizza.", "o": ["isst", "essen", "esse", "esst"], "a": 0, "e": "Uz „du“ ide „isst“."}, {"q": "Wenn es regnet, ___ wir zu Hause.", "o": ["bleiben", "bleibt", "bleibe", "bliebt"], "a": 0, "e": "Uz „wir“ ide „bleiben“."}, {"q": "Wenn sie müde ist, ___ sie früh.", "o": ["schläft", "schlafen", "schlafe", "schläfst"], "a": 0, "e": "Uz „sie“ ide „schläft“."}, {"q": "Koja rečenica je pravilna?", "o": ["Wenn ich Zeit habe, dann gehe ich spazieren.", "Wenn ich habe Zeit, gehe ich spazieren.", "Wenn habe ich Zeit, dann gehe ich spazieren.", "Wenn ich Zeit habe, dann ich gehe spazieren."], "a": 0, "e": "U wenn-rečenici glagol ide na kraj; u glavnoj je inverzija."}, {"q": "___ es kalt ist, friere ich.", "o": ["Wenn", "Deshalb", "Obwohl", "Dass"], "a": 0, "e": "Ovde se izražava uslov/situacija."}, {"q": "Du bestehst die Prüfung, wenn du ___.", "o": ["lernst", "lernen", "lernt", "lerne"], "a": 0, "e": "Uz „du“ ide „lernst“."}, {"q": "Wenn wir Zeit haben, ___ wir spazieren.", "o": ["gehen", "geht", "gehe", "ging"], "a": 0, "e": "Uz „wir“ ide „gehen“."}, {"q": "Wenn es spät ist, ___ wir.", "o": ["schlafen", "schläft", "schlafe", "schläfst"], "a": 0, "e": "Uz „wir“ ide „schlafen“."}, {"q": "Gde stoji glagol u zavisnoj rečenici sa „wenn“?", "o": ["Na kraju", "Na prvom mestu", "Uvek na drugom mestu", "Nema pravila"], "a": 0, "e": "Kao i kod drugih subordinirajućih veznika, glagol ide na kraj."}]}, {"title": "Test 7", "subtitle": "sollte + kuhinjski vokabular", "questions": [{"q": "Du ___ den Arzt besuchen.", "o": ["solltest", "sollte", "sollten", "solltet"], "a": 0, "e": "Uz „du“ ide „solltest“."}, {"q": "Wir ___ mehr Deutsch sprechen.", "o": ["sollten", "solltest", "sollte", "solltet"], "a": 0, "e": "Uz „wir“ ide „sollten“."}, {"q": "Ihr ___ mehr lernen.", "o": ["solltet", "sollten", "solltest", "sollte"], "a": 0, "e": "Uz „ihr“ ide „solltet“."}, {"q": "Du solltest weniger Kaffee ___.", "o": ["trinken", "trinkst", "getrunken", "trank"], "a": 0, "e": "Posle modalnog glagola infinitiv ide na kraj."}, {"q": "„der Löffel“ znači:", "o": ["kašika", "viljuška", "nož", "čaša"], "a": 0, "e": "der Löffel = kašika."}, {"q": "„die Gabel“ znači:", "o": ["viljuška", "tanjir", "šolja", "flaša"], "a": 0, "e": "die Gabel = viljuška."}, {"q": "„das Messer“ znači:", "o": ["nož", "kašika", "šerpa", "rende"], "a": 0, "e": "das Messer = nož."}, {"q": "„der Kühlschrank“ znači:", "o": ["frižider", "šporet", "tanjir", "čaša"], "a": 0, "e": "der Kühlschrank = frižider."}, {"q": "„die Pfanne“ znači:", "o": ["tiganj", "šolja", "činija", "flaša"], "a": 0, "e": "die Pfanne = tiganj."}, {"q": "„die Schüssel“ znači:", "o": ["činija", "rende", "tanjir", "lonac"], "a": 0, "e": "die Schüssel = činija."}]}];
let currentSet=null, idx=0, score=0, answered=false;
const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo({top:0,behavior:"smooth"})}
function buildHome(){
  const g=$("lessonGrid"); g.innerHTML="";
  if(MODE==="multi"){
    DATA.forEach((t,i)=>{
      const d=document.createElement("div"); d.className="lesson";
      d.innerHTML=`<div class="num">${i+1}</div><div><h3>${t.title}</h3><p>${t.subtitle} • ${t.questions.length} pitanja</p></div>`;
      d.onclick=()=>startSet(t); g.appendChild(d);
    });
  } else {
    const d=document.createElement("div"); d.className="lesson";
    d.innerHTML=`<div class="num">✓</div><div><h3>Pokreni završni test</h3><p>${DATA.questions.length} pitanja • ceo A2 kurs</p></div>`;
    d.onclick=()=>startSet(DATA); g.appendChild(d);
  }
}
function startSet(t){currentSet=t; idx=0;score=0;answered=false;$("quizTitle").textContent=t.title;$("quizSub").textContent=t.subtitle||"";show("quiz");render()}
function render(){
  const q=currentSet.questions[idx]; answered=false;
  $("counter").textContent=`Pitanje ${idx+1} od ${currentSet.questions.length}`;
  $("question").textContent=q.q; $("options").innerHTML=""; $("feedback").style.display="none"; $("nextBtn").disabled=true;
  $("nextBtn").textContent=idx===currentSet.questions.length-1?"Završi test":"Sledeće pitanje";
  $("bar").style.width=`${(idx/currentSet.questions.length)*100}%`; $("liveScore").textContent=`${score} bod.`;
  q.o.forEach((opt,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=opt;b.onclick=()=>choose(i,b);$("options").appendChild(b)})
}
function choose(i,b){
  if(answered)return; answered=true; const q=currentSet.questions[idx]; const buttons=[...document.querySelectorAll(".opt")];
  buttons.forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("correct")}); 
  if(i===q.a){score++; $("feedback").innerHTML=`<b>Tačno.</b> ${q.e}`;} else {b.classList.add("wrong");$("feedback").innerHTML=`<b>Netačno.</b> Tačan odgovor: <b>${q.o[q.a]}</b><br>${q.e}`;}
  $("feedback").style.display="block"; $("nextBtn").disabled=false; $("liveScore").textContent=`${score} bod.`; $("bar").style.width=`${((idx+1)/currentSet.questions.length)*100}%`;
}
function finish(){
 const pct=Math.round(score/currentSet.questions.length*100); $("scorePct").textContent=pct+"%"; $("resultTitle").textContent=currentSet.title+" završen";
 let msg=pct>=90?"Odlično poznavanje gradiva.":pct>=75?"Vrlo dobro. Ponovi pitanja na kojima si pogrešio.":pct>=60?"Dobro, ali vredi ponoviti ključna pravila.":"Preporuka: ponovi lekcije i uradi test ponovo.";
 $("resultText").textContent=`${score} od ${currentSet.questions.length} tačnih odgovora. ${msg}`; show("result");
}
$("nextBtn").onclick=()=>{if(!answered)return;if(idx<currentSet.questions.length-1){idx++;render()}else finish()};
$("backBtn").onclick=()=>show("home"); $("homeBtn").onclick=()=>show("home"); $("retryBtn").onclick=()=>startSet(currentSet);
buildHome();
</script>
