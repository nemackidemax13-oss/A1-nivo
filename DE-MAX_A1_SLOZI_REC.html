        delay.connect(wet);wet.connect(master);
        const size=Math.ceil(ctx.sampleRate*.65);
        noiseBuffer=ctx.createBuffer(1,size,ctx.sampleRate);
        const data=noiseBuffer.getChannelData(0);
        for(let i=0;i<size;i++)data[i]=Math.random()*2-1;
      }
      if(ctx.state==="suspended")ctx.resume().catch(()=>{});
      return ctx;
    }catch(e){return null}
  }
  function volume(node,t,peak,attack,decay){
    node.gain.setValueAtTime(.0001,t);
    node.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+attack);
    node.gain.exponentialRampToValueAtTime(.0001,t+decay);
  }
  function oscillator(freq,t,dur,level,type="sawtooth",cut=1800,echo=false){
    if(!ctx)return;
    try{
      const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,t);
      f.type="lowpass";f.frequency.setValueAtTime(cut,t);
      f.frequency.exponentialRampToValueAtTime(Math.max(210,cut*.42),t+dur);
      f.Q.value=.7;
      volume(g,t,level,.009,dur);
      o.connect(f);f.connect(g);g.connect(master);
      if(echo){const send=ctx.createGain();send.gain.value=.24;g.connect(send);send.connect(delay)}
      o.start(t);o.stop(t+dur+.025);
    }catch(e){}
  }
  function noise(t,dur,level,cut,mode="highpass"){
    if(!noiseBuffer)return;
    try{
      const o=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      o.buffer=noiseBuffer;f.type=mode;f.frequency.value=cut;
      volume(g,t,level,.003,dur);
      o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.006);
    }catch(e){}
  }
  function kick(t,accent=1){
    try{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.setValueAtTime(156,t);
      o.frequency.exponentialRampToValueAtTime(46,t+.115);
      volume(g,t,.39*accent,.006,.19);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+.21);
      noise(t,.025,.035,3300);
    }catch(e){}
  }
  function snare(t){
    noise(t,.16,.16,1300);noise(t+.018,.095,.07,2300);
    oscillator(181,t,.105,.067,"triangle",600);
  }
  function hat(t,open=false,accent=false){
    noise(t,open?.19:.052,open?.052:accent?.049:.031,6600);
  }
  const chords=[
    {bass:45,triad:[69,72,76]},  /* Am */
    {bass:41,triad:[69,72,77]},  /* F  */
    {bass:48,triad:[67,72,76]},  /* C  */
    {bass:43,triad:[67,71,74]}   /* G  */
  ];
  const hook=[
    76,null,79,null,81,null,79,76,72,null,76,79,76,null,72,null,
    76,null,77,null,81,null,79,77,76,null,72,76,72,null,null,null,
    79,null,76,null,72,76,79,null,81,null,79,76,74,null,72,null,
    74,null,79,null,81,null,83,81,79,null,76,null,74,72,69,null
  ];
  function playStep(t,count){
    const tick=count%16,bar=Math.floor(count/16)%4,section=Math.floor(count/64);
    const chord=chords[bar],root=chord.bass;
    /* Club rhythm: strong kick, clap on 2 & 4, sharp syncopated hats */
    if(tick%4===0)kick(t,tick===0?1.08:1);
    if(tick===14&&bar===3)kick(t,.68);
    if(tick===4||tick===12)snare(t);
    if(tick%2===0)hat(t,tick===6||tick===14,tick===2||tick===10);
    if(tick===7||tick===15)hat(t,false,false);
    /* Driving octave bass, shortened to leave space for the kick. */
    const bassLine={0:0,2:0,3:12,6:7,8:0,10:12,11:7,14:0};
    if(Object.prototype.hasOwnProperty.call(bassLine,tick)){
      const pitch=root+bassLine[tick],dur=tick===3||tick===11?.105:.18;
      oscillator(midi(pitch),t,dur,.108,"sawtooth",500);
      oscillator(midi(pitch-12),t,dur,.039,"sine",200);
    }
    /* Warm rhythmic chord stabs: dance/pop feel rather than sleepy beeps. */
    if(tick===2||tick===10||(tick===15&&bar===3)){
      chord.triad.forEach((n,i)=>oscillator(midi(n),t,.185,.021,"sawtooth",1400+i*125));
    }
    /* Bright catchy melody, with tiny delay on main hook. */
    const melody=hook[count%hook.length];
    if(melody!==null&&((count%4)!==0||section%2===0)){
      oscillator(midi(melody),t,.13,.059,"square",2900,true);
      oscillator(midi(melody+12),t,.095,.011,"sine",5300);
    }
    if(tick===15&&bar===3){noise(t,.18,.05,3100)}
  }
  function schedule(){
    if(!playing||!enabled||!ctx)return;
    try{
      let count=0;
      while(nextTime<ctx.currentTime+LOOKAHEAD&&count++<8){
        playStep(nextTime,step);
        nextTime+=STEP;step++;
      }
    }catch(e){}
  }
  function stop(){
    playing=false;
    if(interval!==null){clearInterval(interval);interval=null}
    if(ctx&&master){
      try{
        const t=ctx.currentTime;master.gain.cancelScheduledValues(t);
        master.gain.setTargetAtTime(.0001,t,.025)
      }catch(e){}
    }
  }
  function start(){
    if(playing||!enabled)return;
    const a=prepare();if(!a)return;
    playing=true;step=0;nextTime=a.currentTime+.055;
    const t=a.currentTime;master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(.0001,t);
    master.gain.setTargetAtTime(.23,t,.055);
    schedule();interval=setInterval(schedule,30);
  }
  btn.addEventListener("click",function(e){
    e.stopPropagation();enabled=!enabled;label();
    try{localStorage.setItem("demax_a1_music",enabled?"on":"off")}catch(e){}
    if(enabled&&document.documentElement.dataset.demaxGameStarted==="yes")start();
    else stop();
  });
  label();
  const header=document.querySelector(".top,.header");if(header)header.appendChild(btn);
  window.DeMaxMusic={
    start:function(){document.documentElement.dataset.demaxGameStarted="yes";start()},
    stop:function(){document.documentElement.dataset.demaxGameStarted="no";stop()}
  };
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)stop();
    else if(document.documentElement.dataset.demaxGameStarted==="yes")start()
  });
  window.addEventListener("pagehide",stop);
})();
</script>
<style>

<script>
/* Original De-Max arcade effects: synthesised sound; no external audio or files. */
(function(){
"use strict";
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const layer=document.createElement("div");layer.className="fx-layer";layer.setAttribute("aria-hidden","true");document.body.appendChild(layer);
const palette=["#ffd54a","#21d7ff","#ff5f91","#65f7ac","#ab86ff","#fff","#ff9e35"];
function center(node){const r=node?.getBoundingClientRect?.();return r?{x:r.left+r.width/2,y:r.top+r.height/2}:{x:innerWidth/2,y:innerHeight*.48}}
function burst(p,n=28,mult=1){
 if(reduce)return;
 const frag=document.createDocumentFragment();
 for(let i=0;i<n;i++){let a=Math.PI*2*i/n+Math.random()*.45,d=(42+Math.random()*105)*mult;
 const el=document.createElement("i");el.className="fx-spark";
 el.style.left=p.x+"px";el.style.top=p.y+"px";
 el.style.setProperty("--dx",Math.cos(a)*d+"px");el.style.setProperty("--dy",Math.sin(a)*d+"px");
 el.style.setProperty("--sz",(4+Math.random()*8)+"px");el.style.setProperty("--duration",(650+Math.random()*450)+"ms");
 el.style.setProperty("--color",palette[i%palette.length]);el.style.setProperty("--spin",(180+Math.random()*720)+"deg");
 if(i%3===0)el.style.setProperty("--radius","2px");
 el.addEventListener("animationend",()=>el.remove(),{once:true});frag.appendChild(el)}
 layer.appendChild(frag);
}
function flash(color){if(reduce)return;const el=document.createElement("div");el.className="fx-flash";el.style.background=color;document.body.appendChild(el);setTimeout(()=>el.remove(),410)}
function pop(node){if(reduce||!node)return;node.classList.remove("fx-pop");void node.offsetWidth;node.classList.add("fx-pop");setTimeout(()=>node.classList.remove("fx-pop"),420)}
function points(p){if(reduce)return;const el=document.createElement("div");el.className="fx-points";el.style.left=p.x+"px";el.style.top=p.y+"px";el.textContent="+10 ✨";layer.appendChild(el);setTimeout(()=>el.remove(),1100)}
function victory(){
 const p={x:innerWidth/2,y:Math.min(innerHeight*.44,330)};
 burst(p,innerWidth<430?55:95,2.5);
 let i=0;const job=setInterval(()=>{if(++i>5){clearInterval(job);return}burst({x:20+Math.random()*(innerWidth-40),y:innerHeight*(.18+Math.random()*.4)},15,1.5)},150);
 flash("radial-gradient(circle,#ffef9580,transparent 75%)");
}
let audioCtx=null;
function getAudio(){try{if(localStorage.getItem("demax_a1_sound")==="off")return null;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;audioCtx??=new Audio();if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function pitch(f,to,d=.18,vol=.07,delay=0,type="sine"){
 const a=getAudio();if(!a)return;
 try{const t=a.currentTime+delay,o=a.createOscillator(),gain=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+d);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(vol,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(gain);gain.connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}
function sfx(type){
 if(type==="tap"){pitch(560,820,.085,.031)}
 if(type==="correct"){
  pitch(523,659,.16,.07);pitch(659,880,.19,.075,.1);pitch(880,1320,.29,.072,.23);
  pitch(1046,1568,.35,.024,.3,"triangle");
 }else if(type==="wrong"){
  pitch(320,145,.24,.085,0,"triangle");pitch(165,95,.28,.045,.10,"sawtooth");
 }else if(type==="win"){
  [523,659,784,1047,1318,1568].forEach((f,i)=>pitch(f,f*1.06,.29,.052,i*.11,i%2?"triangle":"sine"));
  pitch(261.6,262,.87,.027,.19,"triangle");
 }else if(type==="spin"){
  [330,440,550,660,880].forEach((f,i)=>pitch(f,f*1.2,.12,.045,i*.07,"triangle"));
 }
}
function effect(type){
 if(type==="tap")return;
 if(type==="correct"){
  const p=center(document.querySelector("#feedback"));burst(p,innerWidth<430?24:36,1.2);points(p);pop(document.querySelector("#score"));
  flash("radial-gradient(circle at center,#9bffba5c,transparent 70%)");
  if(navigator.vibrate)navigator.vibrate(18);
 }else if(type==="wrong"){
  const panel=document.querySelector("#game");if(panel){panel.classList.remove("fx-shake");void panel.offsetWidth;panel.classList.add("fx-shake");setTimeout(()=>panel.classList.remove("fx-shake"),420)}
  flash("linear-gradient(90deg,#ff45496b,transparent 38%,transparent 62%,#ff45496b)");
  if(navigator.vibrate)navigator.vibrate([35,30,50]);
 }else if(type==="win"){victory();if(navigator.vibrate)navigator.vibrate([30,30,30])}
}
const original=window.DeMaxSound;
if(original){original.play=function(type){effect(type);sfx(type)}}
document.addEventListener("click",e=>{
 const btn=e.target.closest(".letters button");if(btn&&!btn.disabled){pop(document.querySelector(".answerline"))}
},false);
})();
