';const bank=document.createElement('div');bank.className='letters';const letters=shuffle([...w[0]]);const tiles=letters.map(ch=>{let b=button(ch,()=>{if(lock)return;b.disabled=true;answer.push({ch,b});line.textContent=answer.map(x=>x.ch).join('')},'');bank.appendChild(b);return b});$('area').append(line,bank);$('controls').append(button('⌫ Obriši',()=>{if(lock)return;const v=answer.pop();if(v)v.b.disabled=false;line.textContent=answer.map(x=>x.ch).join('')},'action pale'),button('✓ Proveri',()=>{if(lock)return;if(answer.length!==letters.length){notice('Iskoristi sva slova.',false);return}lock=true;moves++;const ok=answer.map(x=>x.ch).join('').toLowerCase()===w[0].toLowerCase();if(ok){score+=10;notice('Tačno! '+w[0]+' +10',true)}else notice('Tačna reč: '+w[0],false);stats();$('controls').replaceChildren(button('Dalje →',()=>{round++;next()},'action green'))},'action green'))}function truefalse(){if(round>=15)return finish('Odlično odigrano! 🏆');const w=pick(WORDS);const truth=Math.random()<.5;const fake=pick(WORDS.filter(x=>x[1]!==w[1]));$('prompt').textContent=w[0]+' = '+(truth?w[1]:fake[1])+' ?';$('area').className='row';[true,false].forEach(v=>$('area').append(button(v?'✅ Tačno':'❌ Netačno',()=>{if(lock)return;lock=true;moves++;const ok=v===truth;if(ok){score+=10;notice('Tačno! +10',true)}else notice('Netačno! '+w[0]+' = '+w[1],false);stats();$('controls').append(button('Dalje →',()=>{round++;$('area').className='';next()},'action green'))},'action '+(v?'green':'red'))))}function sentence(){if(round>=10)return finish('Sve rečenice su završene! 🏆');const s=SENTENCES[round%SENTENCES.length];const correct=s[0].split(' ');const mixed=shuffle(correct.map((t,i)=>({t,i})));selected=[];$('prompt').textContent=s[1];const chosen=document.createElement('div');chosen.className='sentence chosen';const bank=document.createElement('div');bank.className='sentence';mixed.forEach(o=>{const b=button(o.t,()=>{if(lock)return;b.disabled=true;selected.push({o,b});chosen.appendChild(but /* DE-MAX sound effects: self-contained Web Audio, no downloaded files */
(function(){
  "use strict";

  function tone(f,d,delay=0,kind="sine",vol=.075){

    try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=kind;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
  }

  const b=document.createElement("button");
