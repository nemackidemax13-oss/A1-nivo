<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DE-MAX A1 – Oficijalno vreme</title>
<style>
:root{
  --blue:#0f5ee8;
  --blue2:#2f7cf4;
  --text:#14213d;
  --muted:#667085;
  --green:#16a34a;
  --red:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#f8fbff 0%,#eaf3ff 100%);
  color:var(--text);
}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding:14px 14px 34px;
}
.top{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  border-radius:24px;
  padding:18px;
  box-shadow:0 14px 30px rgba(15,94,232,.18);
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.logo{
  font-weight:950;
  font-size:26px;
  letter-spacing:.3px;
}
.level{
  font-size:12px;
  font-weight:800;
  background:rgba(255,255,255,.18);
  padding:7px 10px;
  border-radius:999px;
}
.title{
  margin:12px 0 5px;
  font-weight:950;
  font-size:22px;
}
.sub{
  opacity:.92;
  font-size:14px;
}
.card{
  margin-top:14px;
  background:#fff;
  border:1px solid #e6eeff;
  border-radius:22px;
  padding:14px;
  box-shadow:0 10px 24px rgba(37,99,235,.08);
}
.question{
  text-align:center;
  font-size:25px;
  font-weight:950;
  margin:3px 0 14px;
}
.clock-shell{
  width:min(100%,430px);
  margin:0 auto;
  border-radius:26px;
  padding:12px;
  background:linear-gradient(145deg,#636b77,#171a20 46%,#08090b);
  border:1px solid #858c98;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -5px 12px rgba(0,0,0,.75),
    0 12px 24px rgba(0,0,0,.18);
}
.clock-topline,
.clock-bottomline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#d1d5db;
  font-size:10px;
  font-weight:900;
  letter-spacing:.14em;
  padding:0 7px 7px;
}
.clock-bottomline{
  justify-content:center;
  padding:7px 0 0;
  color:#9ca3af;
  letter-spacing:.18em;
}
.clock-screen{
  position:relative;
  border-radius:18px;
  padding:20px 10px;
  background:
    radial-gradient(circle at 50% 38%,#102119 0,#06100b 34%,#020403 72%,#000 100%);
  border:4px solid #0d1014;
  box-shadow:
    inset 0 0 0 2px #2f353c,
    inset 0 0 24px rgba(0,0,0,.95);
}
.clock-screen:before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:11px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 30%);
  pointer-events:none;
}
.clock-digits{
  position:relative;
  text-align:center;
  font-family:"Courier New",monospace;
  font-weight:900;
  font-size:clamp(52px,15vw,84px);
  line-height:1;
  letter-spacing:.03em;
  color:#48ff62;
  text-shadow:
    0 0 4px #48ff62,
    0 0 10px rgba(72,255,98,.85),
    0 0 22px rgba(72,255,98,.42);
  font-variant-numeric:tabular-nums;
}
.prompt{
  text-align:center;
  font-size:26px;
  font-weight:950;
  margin:18px 0 5px;
}
.hint{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:12px;
}
.options{
  display:grid;
  gap:11px;
}
.option{
  width:100%;
  min-height:60px;
  border:2px solid #dfe9fb;
  background:#fff;
  border-radius:16px;
  padding:14px 15px;
  text-align:center;
  font-size:17px;
  font-weight:900;
  color:#16305e;
  cursor:pointer;
  transition:.15s;
}
.option:hover{
  border-color:#9abcf5;
  transform:translateY(-1px);
}
.option.correct{
  border-color:#42c477;
  background:#effcf4;
  color:#11652f;
}
.option.wrong{
  border-color:#ef8080;
  background:#fff2f2;
  color:#a30f0f;
}
.feedback{
  display:none;
  margin-top:13px;
  border-radius:18px;
  padding:14px;
}
.feedback.show{display:block}
.feedback.good{
  background:#eefbf3;
  border:1px solid #bde7cb;
}
.feedback.bad{
  background:#fff2f2;
  border:1px solid #f7c1c1;
}
.german{
  font-weight:950;
  font-size:21px;
  color:#0c5f2b;
}
.translation{
  margin-top:5px;
  font-size:15px;
  color:#455469;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:13px;
}
.btn{
  flex:1;
  border:0;
  border-radius:15px;
  padding:13px 12px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}
.primary{
  background:var(--blue);
  color:white;
}
.secondary{
  background:#edf4ff;
  color:#1d4f9b;
}
.note{
  text-align:center;
  color:#7a879c;
  font-size:12px;
  margin-top:10px;
}
@media (max-width:390px){
  .app{padding:10px 10px 26px}
  .top{border-radius:20px;padding:15px}
  .title{font-size:20px}
  .card{border-radius:18px;padding:11px}
  .prompt{font-size:22px}
  .option{font-size:16px;padding:13px}
}
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="brand">
      <div class="logo">DE‑MAX</div>
      <div class="level">A1 • Uhrzeit</div>
    </div>
    <div class="title">🕒 Oficijalno vreme</div>
    <div class="sub">Pogledaj digitalni sat i izaberi tačan odgovor.</div>
  </section>

  <section class="card">
    <div class="question">Wie spät ist es?</div>

    <div class="clock-shell">
      <div class="clock-topline">
        <span>DIGITALZEIT</span>
        <span>24H</span>
      </div>
      <div class="clock-screen">
        <div class="clock-digits">14:30</div>
      </div>
      <div class="clock-bottomline">OFFIZIELL • 0–24 UHR</div>
    </div>

    <div class="prompt">Es ist …</div>
    <div class="hint">Izaberi tačan odgovor.</div>

    <div class="options" id="options">
      <button class="option" data-correct="true">Es ist vierzehn Uhr dreißig.</button>
      <button class="option" data-correct="false">Es ist dreizehn Uhr vierzig.</button>
    </div>

    <div class="feedback" id="feedback">
      <div class="german" id="feedbackTitle"></div>
      <div class="translation" id="translation"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="repeatBtn">🔊 Ponovi</button>
      <button class="btn primary" id="resetBtn">Ponovo ↻</button>
    </div>

    <div class="note">Posle odgovora automatski se čuje nemački izgovor i prikazuje prevod.</div>
  </section>
</div>

<script>
const options = document.querySelectorAll(".option");
const feedback = document.getElementById("feedback");
const feedbackTitle = document.getElementById("feedbackTitle");
const translation = document.getElementById("translation");
const repeatBtn = document.getElementById("repeatBtn");
const resetBtn = document.getElementById("resetBtn");

const sentence = "Es ist vierzehn Uhr dreißig.";

function speak(){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sentence);
  u.lang = "de-DE";
  u.rate = 0.82;
  u.pitch = 1;
  const voices = speechSynthesis.getVoices();
  const german = voices.find(v => /^de(-|_)/i.test(v.lang));
  if(german) u.voice = german;
  speechSynthesis.speak(u);
}

options.forEach(btn => {
  btn.addEventListener("click", () => {
    options.forEach(b => b.disabled = true);

    const ok = btn.dataset.correct === "true";

    options.forEach(b => {
      if(b.dataset.correct === "true") b.classList.add("correct");
    });

    if(!ok) btn.classList.add("wrong");

    feedback.className = "feedback show " + (ok ? "good" : "bad");
    feedbackTitle.textContent = ok
      ? "✓ Es ist vierzehn Uhr dreißig."
      : "✗ Richtig: Es ist vierzehn Uhr dreißig.";

    translation.innerHTML = "<b>Prevod:</b> Četrnaest časova i trideset minuta.";

    speak();
  });
});

repeatBtn.addEventListener("click", speak);

resetBtn.addEventListener("click", () => {
  options.forEach(b => {
    b.disabled = false;
    b.classList.remove("correct","wrong");
  });
  feedback.className = "feedback";
  feedbackTitle.textContent = "";
  translation.textContent = "";
});
</script>
</body>
</html>
