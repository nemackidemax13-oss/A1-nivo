<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DE-MAX A1 – Slika i odgovor</title>
<style>
:root{--blue:#0f5ee8;--blue2:#2f7cf4;--text:#14213d;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#f8fbff,#eaf3ff);color:var(--text)}
.app{max-width:560px;margin:auto;padding:12px;min-height:100vh}
.top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:22px;padding:17px;box-shadow:0 12px 26px rgba(15,94,232,.17)}
.brand{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900} .level{font-size:12px;font-weight:800;background:#ffffff2b;padding:7px 10px;border-radius:999px}
h1{font-size:21px;margin:12px 0 5px} .sub{font-size:14px;opacity:.92}
.bar{height:8px;background:#ffffff35;border-radius:99px;margin-top:13px;overflow:hidden} .fill{height:100%;width:0;background:#fff}
.card{background:#fff;border:1px solid #e4edff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 22px rgba(37,99,235,.07)}
.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.nav button{border:0;border-radius:9px;padding:7px 0;background:#edf4ff;color:#2459aa;font-weight:900}
.nav button.active{background:var(--blue);color:#fff} .nav button.done{background:#dcfce7;color:#14783a}
.count{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px}
img{display:block;width:100%;border-radius:16px;border:1px solid #dbe7ff;aspect-ratio:4/3;object-fit:cover}
.question{font-size:24px;font-weight:900;text-align:center;margin:13px 0 10px}
.blank{display:inline-block;min-width:150px;border-bottom:3px solid #bdd1ff;transform:translateY(-2px)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.options{display:grid;gap:9px}
.option{border:2px solid #dfe9fb;background:#fff;border-radius:14px;padding:13px;text-align:left;font-size:16px;font-weight:800;color:#16305e}
.option.correct{border-color:#42c477;background:#effcf4;color:#11652f} .option.wrong{border-color:#ef8080;background:#fff2f2;color:#a30f0f}
.feedback{display:none;margin-top:11px;border-radius:15px;padding:12px} .feedback.show{display:block}
.good{background:#eefbf3;border:1px solid #bde7cb} .bad{background:#fff2f2;border:1px solid #f7c1c1}
.german{font-size:19px;font-weight:900;color:#0c5f2b} .tr{margin-top:5px;font-size:14px;color:#455469}
.actions{display:flex;gap:8px;margin-top:11px} .btn{flex:1;border:0;border-radius:13px;padding:12px;font-weight:900}
.primary{background:var(--blue);color:#fff} .secondary{background:#edf4ff;color:#1d4f9b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px} .stat{background:#f7faff;border:1px solid #e3ecfb;border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;color:#0f5ee8;font-size:17px} .stat span{font-size:10px;color:#667085;font-weight:700}
@media(max-width:390px){.nav{grid-template-columns:repeat(5,1fr)}.question{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<section class="top">
<div class="brand"><div class="logo">DE‑MAX</div><div class="level">A1 • Räume</div></div>

</section>

let index=0,correct=0,attempts=0;
const solved=new Set(),$=s=>document.querySelector(s);

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.84;
 const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^de/i.test(x.lang)); if(v)u.voice=v;
 speechSynthesis.speak(u);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(){
 let n=$("#nav");n.innerHTML="";
 items.forEach((x,i)=>{let b=document.createElement("button");b.textContent=i+1;if(i===index)b.classList.add("active");if(solved.has(i))b.classList.add("done");b.onclick=()=>{index=i;render()};n.appendChild(b)})
}
function stats(){
 $("#correct").textContent=correct;$("#attempts").textContent=attempts;
 $("#accuracy").textContent=attempts?Math.round(correct/attempts*100)+"%":"0%";
 $("#progress").style.width=(solved.size/items.length*100)+"%";
}
function render(){
 const it=items[index];
 $("#counter").textContent=`Primer ${index+1} / ${items.length}`;
 $("#roomImg").src=it.img_data;
 $("#feedback").className="feedback";$("#feedback").innerHTML="";
 let opts=shuffle([it,...shuffle(items.filter((x,i)=>i!==index)).slice(0,3)]);
 let box=$("#options");box.innerHTML="";
 opts.forEach(o=>{let b=document.createElement("button");b.className="option";b.textContent=o.de;b.onclick=()=>answer(b,o.de===it.de);box.appendChild(b)});
 $("#next").textContent=index===items.length-1?"Završi ✓":"Sledeće →";nav();stats();
}
function answer(btn,ok){
 const it=items[index];attempts++;
 [...$("#options").children].forEach(b=>b.disabled=true);
 if(ok){correct++;solved.add(index);btn.classList.add("correct");$("#feedback").className="feedback show good"}
 else{btn.classList.add("wrong");[...$("#options").children].find(b=>b.textContent===it.de)?.classList.add("correct");$("#feedback").className="feedback show bad"}
 $("#feedback").innerHTML=`<div class="german">${ok?"✓":"→"} ${it.sentence}</div><div class="tr"><b>Prevod:</b> ${it.translation}</div>`;
 speak(it.sentence);nav();stats();
}
$("#repeat").onclick=()=>speak(items[index].sentence);
$("#next").onclick=()=>{if(index<items.length-1){index++;render()}else{let p=attempts?Math.round(correct/attempts*100):0;$("#feedback").className="feedback show good";$("#feedback").innerHTML=`<div class="german">🎉 Vežba je završena!</div><div class="tr">Tačnost: <b>${p}%</b></div>`;speak("Sehr gut! Die Übung ist fertig.")}};
render();
</script>
