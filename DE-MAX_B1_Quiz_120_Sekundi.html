"ist / gegangen","wurde / gegangen"],"a":1,"e":"„gehen“ koristi pomoćni glagol „sein“: „war gegangen“."},{"tag":"PLUSQUAMPERFEKT","q":"Koja rečenica je pravilna?","o":["Er hatte das Buch gelesen.","Er war das Buch gelesen.","Er hatte gelesen das Buch.","Er hat das Buch gelesen hatte."],"a":0,"e":"U Plusquamperfektu: „hatte“ je na 2. mestu, Partizip II na kraju."},{"tag":"PLUSQUAMPERFEKT","q":"Koja radnja se Plusquamperfektom obično označava?","o":["Radnja koja će se tek desiti","Radnja koja se desila pre druge radnje u prošlosti","Navika u sadašnjosti","Trajna buduća radnja"],"a":1,"e":"Plusquamperfekt izražava pretprošlost — ono što se desilo pre druge prošle radnje."}]},{"title":"Lekcija 2","topics":"4–5. čas • obwohl • Relativpronomen","questions":[{"tag":"OBWOHL","q":"Veznik „obwohl“ znači:","o":["zato što","iako / uprkos tome","kada","zbog toga"],"a":1,"e":"„obwohl“ = iako, uprkos tome."},{"tag":"OBWOHL","q":"Izaberi pravilnu rečenicu.","o":["Ich gehe spazieren, obwohl es regnet.","Ich gehe spazieren, obwohl es regnen.","Ich gehe spazieren, obwohl regnet es.","Ich gehe spazieren obwohl, es regnet."],"a":0,"e":"U zavisnoj rečenici sa „obwohl“ glagol ide na kraj."},{"tag":"OBWOHL","q":"Kako pravilno početi rečenicu sa „obwohl“: „Er arbeitet, obwohl er krank ist.“?","o":["Obwohl er krank ist, arbeitet er.","Obwohl er ist krank, er arbeitet.","Obwohl krank er ist, arbeitet er.","Obwohl er krank ist, er arbeitet."],"a":0,"e":"Posle zavisne rečenice sledi inverzija u glavnoj: „arbeitet er“."},{"tag":"OBWOHL","q":"Dopuni: „Obwohl sie keine Zeit ___, kommt sie heute.“","o":["haben","hat","ist","hätte"],"a":1,"e":"Subjekat je „sie“; glagol „hat“ stoji na kraju zavisne rečenice."},{"tag":"OBWOHL","q":"Koja rečenica je pravilna?","o":["Obwohl es schwer ist, lerne ich Deutsch.","Obwohl es ist schwer, ich lerne Deutsch.","Obwohl schwer ist es, lerne ich Deutsch.","Obwohl ist es schwer, lerne Deutsch ich."],"a":0,"e":"„Obwohl es schwer ist, lerne ich Deutsch.“"},{"tag":"OBWOHL","q":"Dopuni: „Obwohl du müde bist, ___ du Fußball.“","o":["spielst","du spielst","spielst du","spielen"],"a":0,"e":"Posle cele zavisne rečenice glagol glavne rečenice dolazi odmah: „spielst du“; u prazninu ide „spielst“."},{"tag":"OBWOHL","q":"Šta se dešava sa glagolom u „obwohl“ rečenici?","o":["Ide na prvo mesto","Ide na drugo mesto","Ide na kraj zavisne rečenice","Izostavlja se"],"a":2,"e":"„obwohl“ uvodi zavisnu rečenicu, pa glagol ide na kraj."},{"tag":"OBWOHL","q":"Izaberi pravilan nastavak: „Obwohl ich müde bin, …“","o":["ich gehe spazieren.","gehe ich spazieren.","spazieren ich gehe.","ich spazieren gehe."],"a":1,"e":"Kada zavisna rečenica stoji prva, glavna počinje glagolom: „gehe ich…“"},{"tag":"RELATIVPRONOMEN","q":"Nominativ, muški rod: „Das ist der Mann, ___ neben mir wohnt.“","o":["den","dem","der","dessen"],"a":2,"e":"Za muški rod u nominativu relativna zamenica je „der“."},{"tag":"RELATIVPRONOMEN","q":"Nominativ, ženski rod: „Das ist die Frau, ___ sehr gut Deutsch spricht.“","o":["der","die","den","dem"],"a":1,"e":"Ženski rod, nominativ → „die“."},{"tag":"RELATIVPRONOMEN","q":"Nominativ, srednji rod: „Das ist das Kind, ___ immer laut lacht.“","o":["das","dem","den","die"],"a":0,"e":"Srednji rod, nominativ → „das“."},{"tag":"RELATIVPRONOMEN","q":"Nominativ, množina: „Das sind die Männer, ___ hier arbeiten.“","o":["denen","die","der","den"],"a":1,"e":"Množina u nominativu → „die“."},{"tag":"RELATIVPRONOMEN","q":"Akkusativ, muški rod: „Das ist der Mann, ___ ich gestern gesehen habe.“","o":["der","den","dem","die"],"a":1,"e":"Muški rod, akuzativ → „den“."},{"tag":"RELATIVPRONOMEN","q":"Akkusativ, ženski rod: „Das ist die Hose, ___ ich gestern gekauft habe.“","o":["die","der","den","dem"],"a":0,"e":"Ženski rod, akuzativ → „die“."},{"tag":"RELATIVPRONOMEN","q":"Akkusativ, srednji rod: „Das ist das Buch, ___ ich lesen möchte.“","o":["den","dem","das","der"],"a":2,"e":"Srednji rod, akuzativ → „das“."},{"tag":"RELATIVPRONOMEN","q":"Akkusativ, množina: „Die Hemden, ___ ich gewaschen habe, sind trocken.“","o":["denen","die","der","das"],"a":1,"e":"Množina u akuzativu → „die“."},{"tag":"RELATIVPRONOMEN","q":"Dativ, muški rod: „Das ist der Hund, ___ ich eine Wurst gegeben habe.“","o":["den","dem","der","dessen"],"a":1,"e":"Muški rod, dativ → „dem“."},{"tag":"RELATIVPRONOMEN","q":"Dativ, ženski rod: „Eine Psychologin ist eine Person, ___ man alles erzählen kann.“","o":["die","der","dem","denen"],"a":1,"e":"Ženski rod, dativ → „der“."},{"tag":"RELATIVPRONOMEN","q":"Dativ, srednji rod: „Das Mädchen, ___ ich ein Buch geliehen habe, ist krank.“","o":["dem","das","den","der"],"a":0,"e":"Srednji rod, dativ → „dem“."},{"tag":"RELATIVPRONOMEN","q":"Dativ, množina: „Das sind die Kinder, mit ___ ich Fußball spiele.“","o":["die","den","denen","der"],"a":2,"e":"Množina u dativu → „denen“."}]},{"title":"Lekcija 3","topics":"6–8. čas • Futur I • Genitiv • Passiv Präsens","questions":[{"tag":"FUTUR I","q":"Futur I se gradi pomoću:","o":["haben + Partizip II","sein + Partizip II","werden + infinitiv","wurde + Partizip II"],"a":2,"e":"Futur I = konjugovani „werden“ + infinitiv glavnog glagola na kraju."},{"tag":"FUTUR I","q":"Oblik glagola „werden“ za „du“ je:","o":["werde","wirst","wird","werdet"],"a":1,"e":"du wirst."},{"tag":"FUTUR I","q":"Oblik glagola „werden“ za „er/sie/es“ je:","o":["werden","werdet","wird","werde"],"a":2,"e":"er/sie/es wird."},{"tag":"FUTUR I","q":"Dopuni: „Wir ___ Kaffee trinken.“","o":["wird","werdet","werden","wirst"],"a":2,"e":"wir werden."},{"tag":"FUTUR I","q":"Izaberi pravilnu rečenicu.","o":["Ich werde ein Auto kaufen.","Ich ein Auto werde kaufen.","Ich werde kaufen ein Auto.","Werde ich ein Auto kaufen."],"a":0,"e":"U potvrdnoj rečenici „werden“ je na 2. mestu, infinitiv na kraju."},{"tag":"FUTUR I","q":"Koje W-pitanje je pravilno?","o":["Wann du wirst Deutsch lernen?","Wann wirst du Deutsch lernen?","Wann Deutsch lernen wirst du?","Wirst wann du Deutsch lernen?"],"a":1,"e":"W-reč + werden + lice + ostal ko ja čitam, brat gleda TV.","Ich lese, obwohl mein Bruder fernsieht. / Iako ja čitam, brat gleda TV.","Ich lese, da mein Bruder fernsieht. / Zato što ja čitam, brat gleda TV."],"a":0,"e":"Obe rečenice izražavaju istovremenost."},{"tag":"MIX","q":"Koji niz pravilno povezuje dve mogućnosti?","o":["nicht nur … sondern auch","entweder … oder","zwar … aber","je … desto"],"a":1,"e":"Za dve alternative koristimo „entweder … oder“."},{"tag":"MIX","q":"Koji niz pravilno dodaje drugu informaciju?","o":["nicht nur … sondern auch","entweder … oder","falls","während"],"a":0,"e":"„nicht nur … sondern auch“ dodaje novu informaciju."},{"tag":"MIX","q":"Koji niz uvodi kontrast?","o":["falls","zwar … aber","während","damit"],"a":1,"e":"„zwar … aber“ = doduše … ali."},{"tag":"MIX","q":"Izaberi pravilnu rečenicu.","o":["Falls der Zug nicht fährt, fahren wir mit dem Auto.","Falls der Zug nicht fährt, wir fahren mit dem Auto.","Falls fährt der Zug nicht, fahren wir mit dem Auto.","Der Zug fährt nicht, falls wir mit dem Auto fahren."],"a":0,"e":"Pravilna uslovna rečenica sa „falls“."},{"tag":"MIX","q":"Koja je pravilna?","o":["Sie liest, während ihr Mann fern sieht.","Sie liest, während ihr Mann sieht fern.","Sie liest, während sieht ihr Mann fern.","Sie liest, während ihr Mann fernsehen."],"a":0,"e":"U zavisnoj rečenici glagol ide na kraj: „fern sieht“."}]}],ALL=LESSONS.flatMap(L=>L.questions.map(x=>({...x,lesson:L.title}))),TOTAL=40,SECONDS=120,KEY="demax_b1_quiz120_top5_v1";let qs=[],i=0,score=0,time=SECONDS,tick,finished=false,player="",startedAt=0;const $=id=>document.getElementById(id);
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function makeTwo(x){const w=x.o.map((t,k)=>({t,k})).filter(z=>z.k!==x.a);const bad=w[Math.floor(Math.random()*w.length)].t;return shuffle([{t:x.o[x.a],ok:true},{t:bad,ok:false}])}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.speak(u)}function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function board(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}function save(r){const b=board();b.push(r);b.sort((a,b)=>b.score-a.score||a.timeUsed-b.timeUsed);const t=b.slice(0,5);localStorage.setItem(KEY,JSON.stringify(t));return t}
function html(b){let h="<h3>🏆 Top 5</h3>";if(!b.length)return h+'<p class="small">Još nema rezultata.</p>';b.forEach((r,n)=>h+='<div class="rank"><div class="rankno">'+(n+1)+'</div><b>'+esc(r.name)+'</b><div style="text-align:right"><strong>'+r.score+'/'+TOTAL+'</strong><br><span>'+r.timeUsed+' s</span></div></div>');return h}
function start(){player=$("name").value.trim();if(!player){$("name").focus();return}qs=shuffle([...ALL]).slice(0,TOTAL).map(x=>({...x,two:makeTwo(x)}));startedAt=Date.now();$("start").classList.add("hidden");$("play").classList.remove("hidden");render();tick=setInterval(()=>{time--;$("timer").textContent=fmt(Math.max(0,time));if(time<=15)$("timer").classList.add("danger");if(time<=0)finish()},1000)}
function render(){if(finished)return;const x=qs[i];$("tag").textContent=x.lesson+" • "+x.tag;$("count").textContent=(i+1)+"/"+TOTAL;$("q").textContent=x.q;$("bar").style.width=(i/TOTAL*100)+"%";$("fb").className="feedback";$("opts").innerHTML="";x.two.forEach((z,k)=>{const r=document.createElement("div");r.className="optrow";const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+k)+". "+z.t;b.onclick=()=>answer(z.ok,b);const s=document.createElement("button");s.className="spk";s.textContent="🔊";s.onclick=()=>speak(z.t);r.append(b,s);$("opts").append(r)})}
function answer(ok,b){if(finished||b.disabled)return;const x=qs[i];[...document.querySelectorAll(".opt")].forEach(z=>z.disabled=true);if(ok){score++;b.classList.add("correct");$("fb").className="feedback show good";$("fb").textContent="✓ Tačno!"}else{b.classList.add("wrong");[...document.querySelectorAll(".opt")].forEach(z=>{if(z.textContent.includes(x.o[x.a]))z.classList.add("correct")});$("fb").className="feedback show bad";$("fb").textContent="✕ Nije tačno."}$("bar").style.width=((i+1)/TOTAL*100)+"%";setTimeout(()=>{if(i<TOTAL-1){i++;render()}else finish()},320)}
function finish(){if(finished)return;finished=true;clearInterval(tick);speechSynthesis.cancel();const used=Math.min(SECONDS,Math.max(1,Math.round((Date.now()-startedAt)/1000))),top=save({name:player,score,timeUsed:used});$("play").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+"/"+TOTAL;$("who").textContent=player;$("detail").textContent="Tačnih odgovora: "+score+" • vreme: "+used+" s";$("leaderEnd").innerHTML=html(top);scrollTo({top:0,behavior:"smooth"})}
$("go").onclick=start;$("name").addEventListener("keydown",e=>{if(e.key==="Enter")start()});$("speakQ").onclick=()=>speak(qs[i].q);$("leaderStart").innerHTML=html(board());
