(function(){
  "use strict";
  const palette=["#ffc549","#20d9b0","#26a6f2","#f46b98","#a58cff"];
  function effect(target,good){
    const panel=document.getElementById("game");
    if(!panel||!target)return;
    const r=panel.getBoundingClientRect(),q=target.getBoundingClientRect();
    const x=q.left-r.left+q.width/2,y=q.top-r.top+q.height/2;
    const caption=document.createElement("span");
    caption.className="demax-fx-text "+(good?"good":"bad");

    caption.style.left=x+"px";caption.style.top=y+"px";
    panel.appendChild(caption);setTimeout(()=>caption.remove(),740);
    if(good){
      panel.classList.add("demax-fx-correct");
      setTimeout(()=>panel.classList.remove("demax-fx-correct"),490);
      for(let i=0;i<12;i++){
        const p=document.createElement("i"),angle=(i/12)*Math.PI*2;
        p.className="demax-fx-particle";
        p.style.left=x+"px";p.style.top=y+"px";
        p.style.background=palette[i%palette.length];
        p.style.setProperty("--dx",Math.cos(angle)*(42+i%4*12)+"px");
        p.style.setProperty("--dy",Math.sin(angle)*(34+i%5*10)+"px");
        p.style.setProperty("--rot",(i*53)+"deg");
        panel.appendChild(p);setTimeout(()=>p.remove(),750);
      }
      const score=document.getElementById("score");
      if(score){score.classList.remove("demax-score-pop");void score.offsetWidth;score.classList.add("demax-score-pop");
        setTimeout(()=>score.classList.remove("demax-score-pop"),500)}
    }
  }
  window.DeMaxFX={answer:effect};
})();
